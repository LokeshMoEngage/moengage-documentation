openapi: 3.1.0
info:
  title: Email Templates API V2
  version: v1.0
  description: |
    The Create Email Template API can be used to create an email template in MoEngage. This API helps you upload templates created outside the MoEngage ecosystem to MoEngage and use them for campaign creation. The uploaded templates can be edited in the Froala editor (custom HTML editor) on the MoEngage Dashboard.

    <Note>
    **Note**

    Templates created using this API cannot be used in the Drag and Drop Editor in the MoEngage Dashboard. They are supported only for the Custom HTML Editor (Froala Editor).
    </Note>
servers:
  - url: https://api-{dc}.moengage.com/v1.0
    description: MoEngage API Server
    variables:
      dc:
        default: "01"
        description: "The ‘dc’ in the API Endpoint URL refers to the MoEngage Data Center (DC). MoEngage hosts each customer in a different DC. You can find your DC number and replace the value of ‘dc’ in the URL by referring to the DC and API endpoint mapping [here](/api/introduction#data-centers). Your MoEngage Data Center (DC) can be 01, 02, 03, 04, 05, 06, or 101."

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format 'username:password'.

        - **Username**: Use your MoEngage workspace ID (also known as the App ID). You can find it in the MoEngage dashboard at **Settings** > **Account** > **APIs** > **Workspace ID (earlier app id)**.
        - **Password**: Use your API Key, which you can find within the **Campaign report/Business events/Custom templates/Catalog API/Inform Report** tile.

        For more information on authentication and getting your credentials, refer [here](https://www.moengage.com/docs/api/introduction#getting-your-credentials).

  schemas:
    # Common Error Structure based on HTML
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: "This field contains the error code that provides a brief explanation of the error and is a String. For example, 400 - Bad Request, 401- Authentication required, and so on."
            message:
              type: string
              description: "This field describes why the request has failed and is a String."
            details:
              type: array
              description: "This is a List of the error details objects."
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: "Descriptive Error Code"
                  target:
                    type: string
                    description: "Denotes the field causing the issue or a brief description of the error message in some cases"
                  message:
                    type: string
                    description: "Descriptive Error Message"
            request_id:
              type: string
              description: "This field contains the unique id pertaining to the request."

    BasicDetails:
      type: object
      description: |
        This field contains the email content. This is where you define the email template being created.
      required:
        - email_content
        - subject
        - thumbnail_url
        - sender_name
      properties:
        email_content:
          type: string
          description: This field contains the title of the message.
        subject:
          type: string
          description: |
            This field contains the subject of the email campaign.
            **Example**: "End of Season Sale!"
        attachments:
          type: array
          description: |
            This field contains the attachments to be included in the email.
            
            **Note**:
            * Only URLs can be added as part of Email attachments.
            * A maximum of ten attachments are allowed.
            * The URL should start with https and end with a valid extension. The following extensions are not allowed: .dmg, .exe, .xls, .ddl, .class, .obj, .int, .gnt, .o, .so, .lbr, and .net
            * Individual attachments should be less than 6 MB, and the total size of the attachments should be less than 20 MB.
          items:
            type: string
            format: uri
            example: "https://app-cdn.moengage.com/assets/LogoThumbnail.jpg"
        thumbnail_url:
          type: string
          description: This field contains the image URL used to generate a preview in the Imported API Templates section on the MoEngage dashboard.
        sender_name:
          type: string
          description: |
            This field contains the name that is displayed in the inboxes of your recipients. Sender names are one of the first things people see when you send them an email.
            **Example**: "sender_name": "Your Brand Name"
        preview_text:
          type: string
          description: |
            This field contains the preview text, the text that appears below the subject line in the inbox.
            Example: "preview_text": "Let Your Summer Look Shine"

    EmailConnector:
      type: object
      properties:
        connector_type:
          type: string
          description: |
            This field contains the type of the email connector. Pass the exact enum value, not the connector's display name.
          enum:
            - SENDGRID
            - AMAZON_SES
            - SPARKPOST
            - MANDRILL
            - CUSTOM_SMTP
            - CUSTOM_API
            - NETCORE
          example: "SENDGRID"
        connector_name:
          type: string
          description: This field contains the name of the email connector, exactly as it appears in **Email Settings**.
          example: "sg_primary"

    FromAddress:
      type: string
      description: |
        This field contains a verified from email address of the connector passed in `connector`. You can use personalization (Jinja) in this field only if from address personalization is enabled for your workspace, and not for Inform templates.
      example: "offers@brand.com"

    ReplyToAddress:
      type: string
      format: email
      description: This field contains the reply-to email address for the template. It must be a valid email address.
      example: "support@brand.com"

    CreateBasicDetails:
      allOf:
        - $ref: '#/components/schemas/BasicDetails'
        - type: object
          properties:
            connector:
              allOf:
                - $ref: '#/components/schemas/EmailConnector'
              description: |
                This field contains the email connector to save with the template. Campaigns that use this template reuse the connector, from email address, and reply-to email address saved with it.

                **Note**: Connector details fields are currently released behind a feature flag and may not be available for your workspace. Contact your MoEngage Customer Success Manager (CSM) or the Support team to get them enabled.

                The following rules apply to `connector.connector_type`, `connector.connector_name`, `from_address`, and `reply_to_address`:
                * Pass all four values together, or pass none of them.
                * The connector must exist in **Email Settings** and have at least one verified from email address. The `from_address` value must be one of those verified addresses. If you personalize `from_address`, MoEngage skips the mapping and verification checks for it.
                * Templates in a template group (locale or variation templates) must use the connector of the group's default template. Create the default template with the connector first.
            from_address:
              $ref: '#/components/schemas/FromAddress'
            reply_to_address:
              $ref: '#/components/schemas/ReplyToAddress'

    UpdateBasicDetails:
      allOf:
        - $ref: '#/components/schemas/BasicDetails'
        - type: object
          properties:
            connector:
              allOf:
                - $ref: '#/components/schemas/EmailConnector'
              description: |
                This field contains the email connector to save with the template. Campaigns that use this template reuse the connector, from email address, and reply-to email address saved with it.

                **Note**: Connector details fields are currently released behind a feature flag and may not be available for your workspace. Contact your MoEngage Customer Success Manager (CSM) or the Support team to get them enabled.

                The following rules apply to `connector.connector_type`, `connector.connector_name`, `from_address`, and `reply_to_address`:
                * Pass all four values together, or pass none of them.
                * The connector must exist in **Email Settings** and have at least one verified from email address. The `from_address` value must be one of those verified addresses. If you personalize `from_address`, MoEngage skips the mapping and verification checks for it.
                * Templates in a template group (locale or variation templates) must use the connector of the group's default template. Create the default template with the connector first.

                The following rules also apply when you update a template:
                * If you leave out all four values, the template keeps the values of its previous version.
                * After sender details are set on a template, you can change them, which creates a new version, but you cannot remove them.
                * If `update_latest_version` is `true`, you cannot change the sender details.
                * If `update_campaigns` is `true` and every version of the template has the same sender details, the campaigns using the template are updated to the new version. If the sender details differ across versions, the template is still saved as a new version, but the campaigns are not updated, and the response returns `campaigns_updated` as `false`.
            from_address:
              $ref: '#/components/schemas/FromAddress'
            reply_to_address:
              $ref: '#/components/schemas/ReplyToAddress'

    SearchBasicDetails:
      allOf:
        - $ref: '#/components/schemas/BasicDetails'
        - type: object
          properties:
            connector:
              type: object
              nullable: true
              description: |
                This field contains the email connector saved with the template. It is null for templates without sender details.

                **Note**: Connector details fields are currently released behind a feature flag and may not be available for your workspace. Contact your MoEngage Customer Success Manager (CSM) or the Support team to get them enabled.
              properties:
                connector_type:
                  type: string
                  description: This field contains the type of the email connector.
                  enum:
                    - SENDGRID
                    - AMAZON_SES
                    - SPARKPOST
                    - MANDRILL
                    - CUSTOM_SMTP
                    - CUSTOM_API
                    - NETCORE
                connector_name:
                  type: string
                  description: This field contains the name of the email connector, as it appears in **Email Settings**.
            from_address:
              type: string
              nullable: true
              description: This field contains the from email address saved with the template. It is null for templates without sender details.
            reply_to_address:
              type: string
              nullable: true
              description: This field contains the reply-to email address saved with the template. It is null for templates without sender details.

    MetaInfo:
      type: object
      description: |
        This field contains information about the template being created, such as the name, version, and ID of the template and the creator's details.
      required:
        - template_id
        - template_name
        - template_version
        - created_by
      properties:
        template_id:
          type: string
          description: This field contains the ID for the template and is unique. This ID should be generated by you and will be used for updating or retrieving the template using the template APIs.
        template_name:
          type: string
          description: This field contains the name of the template. This value should be generated by you and would be used for identifying the template.
        template_version:
          type: string
          description: This field contains the version of the template and is unique. This value should be generated by you and would be used for tracking the template's version.
        created_by:
          type: string
          description: This field contains details about who created the template. This value should be generated by you. For example, you can pass the email id of the user creating the template here.
        locale:
          type: string
          description: |
            This field contains the locale to be associated with the template.
            These are the locales available in the MoEngage Dashboard at **Settings > Advanced settings > Locales**.
        variation:
          type: integer
          description: This field contains the variation of the template. You can add a maximum of five variations to each template.
        group_id:
          type: string
          description: |
            This field contains the group ID of the template.
            * Parent template: A parent template is the "default" template with which you can associate child templates. You need not pass a Group ID for a parent template. The "external_template_id" generated for the parent template acts as its group ID.
            * Child template: Pass the Group ID of the parent (default) template with which you want to associate the child template.

    CreateMetaInfo:
      allOf:
        - $ref: '#/components/schemas/MetaInfo'
        - type: object
          properties:
            communication_type:
              type: string
              enum:
                - ENGAGE
                - INFORM
                - ALL
              description: |
                This field contains the type of campaigns the template is used for:
                * `ENGAGE`: Engage campaigns.
                * `INFORM`: Inform alerts.
                * `ALL`: Both Engage campaigns and Inform alerts.

                The value is case-sensitive. Pass it in uppercase only. Values such as `inform` or `Inform` return a 400 error.

                For `INFORM` templates, a personalized (Jinja) `from_address` is not allowed and returns a 400 error.

                If you do not pass this field, it is set to `ALL`.
              example: "ENGAGE"

    UpdateMetaInfo:
      allOf:
        - $ref: '#/components/schemas/MetaInfo'
        - type: object
          properties:
            communication_type:
              type: string
              enum:
                - ENGAGE
                - INFORM
                - ALL
              description: |
                This field contains the type of campaigns the template is used for:
                * `ENGAGE`: Engage campaigns.
                * `INFORM`: Inform alerts.
                * `ALL`: Both Engage campaigns and Inform alerts.

                The value is case-sensitive. Pass it in uppercase only. Values such as `inform` or `Inform` return a 400 error.

                For `INFORM` templates, a personalized (Jinja) `from_address` is not allowed and returns a 400 error.

                If you do not pass this field, the template keeps its current value.
              example: "ENGAGE"

security:
  - basicAuth: []

tags:
  - name: Email Templates
    description: Manage custom email templates.

paths:
  /custom-templates/email:
    post:
      summary: Create Email Template (V2)
      description: |
        This API creates an email template in MoEngage. You can use this API to upload templates created outside the MoEngage ecosystem to MoEngage and use them for campaign creation. The uploaded templates can be edited in the Froala editor (custom HTML editor) on the MoEngage dashboard.
      operationId: createEmailTemplate
      tags:
        - Email Templates
      x-mint:
        content: |
          #### Rate Limit
          The rate limit is 100 RPM. You can upload a maximum of 10000 templates per channel.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - basic_details
                - meta_info
              properties:
                basic_details:
                  $ref: '#/components/schemas/CreateBasicDetails'
                meta_info:
                  $ref: '#/components/schemas/CreateMetaInfo'
                team_name:
                  type: string
                  description: |
                    This field contains the name of the team to which this template should be assigned.

                    Team-based template management lets you create separate templates for different teams within your workspace (for example, a template created by the Marketing team and another by the Engineering team), so that each team's campaigns use their own templates.

                    * `team_name` is mandatory if teams are enabled for your workspace.
                    * If teams are enabled for your workspace and this field is not passed, the template will not be created and the request will fail with an error.
                    * Team-based template management is currently released behind a feature flag and may not be enabled for your workspace. If this flag is not enabled and you pass `team_name`, the request will fail. Reach out to your Customer Success Manager (CSM) to get this setting enabled before using this field.
                    * If teams are not enabled for your workspace, do not pass this field. Existing integrations that use `team_id` (or that do not pass any team information) are unaffected and continue to work as before.
                  example: "team1"
            examples:
              Parent Template in a Template Group:
                summary: Parent Template in a Template Group
                value:
                  basic_details:
                    subject: "Email_Subject"
                    email_content: "<!DOCTYPE html><html><head><title>My Short HTML</title></head><body><h1>Hello, World!</h1><p>This is a simple HTML example.</p></body></html>"
                    thumbnail_url: "{{template_thumbnail_thumbnail_url}}"
                    sender_name: "Sender_Name"
                    preview_text: "Preview_text"
                    attachments: []
                    connector:
                      connector_type: "SENDGRID"
                      connector_name: "sg_primary"
                    from_address: "offers@brand.com"
                    reply_to_address: "support@brand.com"
                  meta_info:
                    created_by: "john.doe@example.com"
                    template_id: "{{template_id_1}}"
                    template_name: "{{template_name}}"
                    template_version: "{{template_version}}"
                    locale: "{{Locale_name}}"
                    variation: 1
              Associated Templates in the Same Template Group:
                summary: Associated Templates in the Same Template Group
                value:
                  basic_details:
                    subject: "Email_Subject"
                    email_content: "<!DOCTYPE html><html><head><title>My Short HTML</title></head><body><h1>Hello, World!</h1><p>This is a simple HTML example.</p></body></html>"
                    thumbnail_url: "{{template_thumbnail_image_url}}"
                    sender_name: "Sender_Name"
                    preview_text: "Preview_text"
                    attachments: []
                    connector:
                      connector_type: "SENDGRID"
                      connector_name: "sg_primary"
                    from_address: "offers@brand.com"
                    reply_to_address: "support@brand.com"
                  meta_info:
                    created_by: "john.doe@example.com"
                    template_id: "{{template_id_2}}"
                    template_name: "{{template_name}}"
                    template_version: "{{template_version}}"
                    locale: "{{Locale_name}}"
                    variation: 2
                    group_id: "{{external_template_id_of_parent_template}}"
      responses:
        '200':
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_template_id:
                    type: string
                    description: |
                      This field contains the unique template id corresponding to a successful template creation request and needs to be stored by you. This template id would be used for searching a specific template and updating it.
                      For a parent (default) template, the generated "external_template_id" acts as its group ID.
              examples:
                success:
                  value:
                    external_template_id: "d05a44f0-a7cf-471a-bcb6-63054800a367"
        '400':
          description: This response is returned when the required parameters are missing from the request, or when the provided parameters are invalid, or when a template already exists with the same version, name, or id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_failure:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "MissingValue"
                          target: "template_id"
                          message: "template_id value is too short"
                      request_id: "LMwPhRMB"
                duplicate_request:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Duplicate - template_id and template_version"
                      details:
                        - code: "InvalidValue"
                          target: "Duplicate - template_id and template_version"
                          message: "template_id:EndOfSeasonSale template_version:10 is already present."
                      request_id: "cLCcgLQj"
                limit_breach:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Maximum Template limit exceeded"
                      details:
                        - code: "NotSupported"
                          target: "Maximum Template limit exceeded"
                          message: "You have already created maximum allowed template allowed for client"
                      request_id: "eLeZXIlW"
                invalid_team_name:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "team_name"
                          message: "team_name\"team2\" does not exist in this workspace"
                      request_id: "NRwyBXpk"
                sender_details_not_enabled:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "sender_details"
                          message: "Sender details on email templates are not enabled for this workspace. Contact your account team to get this feature enabled."
                      request_id: "qT4vNb8K"
                sender_details_incomplete:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "MissingValue"
                          target: "sender_details"
                          message: "connector_type, connector_name, from_address, and reply_to_address must be provided together. Send all four fields together, or omit all four if you are not setting sender details."
                      request_id: "Hs2LpWe9"
                invalid_connector_type:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector_type"
                          message: "connector_type value is invalid. Allowed values are SENDGRID, AMAZON_SES, SPARKPOST, MANDRILL, CUSTOM_SMTP, CUSTOM_API, NETCORE. Use the exact value, not a display name."
                      request_id: "Zr7XcM3d"
                invalid_email_address:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "from_address"
                          message: "from_address should be a valid email address."
                      request_id: "Pk5JyA1u"
                connector_not_found:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector"
                          message: "Connector Sendgrid (sg_primary) is not present in Email Settings. Check the connector name matches Email Settings exactly, or create it there first."
                      request_id: "Wd9FgT6n"
                connector_without_verified_from_address:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector"
                          message: "Connector Sendgrid (sg_primary) has no verified from address. Verify a from address on this connector in Email Settings first."
                      request_id: "Bn3QsR8v"
                from_address_not_verified:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "from_address"
                          message: "from_address x@brand.com is not a verified from address of connector Sendgrid (sg_primary). Verify this address on the connector in Email Settings, or use one that is already verified."
                      request_id: "Ly6HmK2c"
                personalized_from_address_not_enabled:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "from_address"
                          message: "Personalised from_address is not enabled for this workspace."
                      request_id: "Ge8VtD4w"
                personalized_from_address_inform_template:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "from_address"
                          message: "Personalised from_address is not supported for Inform templates (communication_type INFORM). Use a fixed from address."
                      request_id: "Ux1NpZ7r"
                connector_mismatch_with_default_template:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector"
                          message: "Connector must match the group's default template connector, Sendgrid (sg_primary). Use the same connector as the group's default template, or update the default template's connector first if the whole group needs to move."
                      request_id: "Fa4CwY9j"
                default_template_connector_missing:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector"
                          message: "Set the connector on the group's default template before its locale / variation templates. Add the connector to the default template first, then to this template."
                      request_id: "Mo2EbS5x"
        '401':
          description: This response is returned when the authorization parameters are missing in the HTTP Auth Header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                auth_fail:
                  value:
                    title: "Authentication required"
                    description: "MOE-APPKEY missing in Authentication Header"
        '415':
          description: This response is returned when the header Content-Type is not provided/is not supported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  description:
                    type: string
              examples:
                unsupported:
                  value:
                    title: "Unsupported media type"
                    description: "Content type is not supported"
        '429':
          description: This response is returned when the number of requests per minute has exceeded the rate limit, or the number of templates has exceeded the allowed quota per channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  value:
                    response_id: "OUUkHvcn"
                    type: "custom_template"
                    error:
                      code: "Too Many Requests"
                      message: "API rate limit breached. Current limit: n/m mins"
        '500':
          description: This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  message:
                    type: string
              examples:
                server_error:
                  value:
                    title: "Internal Server Error"
                    message: "An unexpected error was encountered while processing this request. Please contact MoEngage Team"

    put:
      summary: Update Email Template
      description: |
        This API updates an email template by specifying its external template ID. You can specify whether the updated version of the template can be used in active campaigns in the request.
      operationId: updateEmailTemplate
      tags:
        - Email Templates
      x-mint:
        content: |
          <Note>
          This API is available on request and isn't enabled by default. To enable it for your workspace, contact your Customer Success Manager or raise a support ticket.
          </Note>

          #### Rate Limit
          The rate limit is 100 Requests Per Minute.
          
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_template_id
                - basic_details
                - meta_info
              properties:
                external_template_id:
                  type: string
                  description: This field contains the unique identifier that is generated during the creation of the template.
                update_campaigns:
                  type: boolean
                  description: |
                    This field contains a flag that is used to update all the campaigns that are currently using the template being updated to the newer version(that is being updated in this request). The default value for this flag is false.
                    
                    When the update_campaigns flag is true, all the campaigns running with this template will get updated to the latest version of the template, and when it is false, the new version of the template will be created, but there will be no change made to the template used in the existing campaigns.
                update_latest_version:
                  type: boolean
                  description: If the value is "true," this API does not create a new version of the template but only updates its contents.
                basic_details:
                  $ref: '#/components/schemas/UpdateBasicDetails'
                meta_info:
                  $ref: '#/components/schemas/UpdateMetaInfo'
                team_name:
                  type: string
                  description: |
                    This field contains the name of the team to which this template should be assigned.

                    Team-based template management lets you create separate templates for different teams within your workspace (for example, a template created by the Marketing team and another by the Engineering team), so that each team's campaigns use their own templates.

                    * `team_name` is mandatory if teams are enabled for your workspace.
                    * If teams are enabled for your workspace and this field is not passed, the template will not be updated and the request will fail with an error.
                    * Team-based template management is currently released behind a feature flag and may not be enabled for your workspace. If this flag is not enabled and you pass `team_name`, the request will fail. Reach out to your Customer Success Manager (CSM) to get this setting enabled before using this field.
                    * If teams are not enabled for your workspace, do not pass this field. Existing integrations that use `team_id` (or that do not pass any team information) are unaffected and continue to work as before.
            examples:
              Update Template:
                summary: Update Template
                value:
                  external_template_id: "{{external_template_id}}"
                  basic_details:
                    subject: "Email_Subject"
                    email_content: "<!DOCTYPE html><html><head><title>My Short HTML</title></head><body><h1>Hello, World!</h1><p>This is a simple HTML example.</p></body></html>"
                    thumbnail_url: "{{template_thumbnail_thumbnail_url}}"
                    sender_name: "Sender_Name"
                    preview_text: "Preview_text"
                    attachments: []
                  meta_info:
                    created_by: "john.doe@example.com"
                    template_id: "{{template_id}}"
                    template_name: "{{template_name}}"
                    template_version: "{{template_version}}"
                    locale: "{{Locale_name}}"
                    variation: 1
                  update_campaigns: true
                  update_latest_version: false
      responses:
        '200':
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_template_id:
                    type: string
                    description: This field contains the unique template id corresponding to a successful template updation request.
                  version:
                    type: string
                    description: This field contains the version of the template after the update. It is returned only when `update_campaigns` or `update_latest_version` is passed in the request.
                  campaigns_updated:
                    type: boolean
                    description: This field indicates whether the campaigns using the template were updated to the new version. It is returned only when `update_campaigns` or `update_latest_version` is passed in the request.
                  message:
                    type: string
                    description: This field contains the reason the campaigns were not updated. It is returned only when `campaigns_updated` is `false`.
              examples:
                success:
                  value:
                    external_template_id: "d05a44f0-a7cf-471a-bcb6-63054800a367"
                campaigns_updated:
                  value:
                    external_template_id: "d05a44f0-a7cf-471a-bcb6-63054800a367"
                    version: "3"
                    campaigns_updated: true
                campaigns_not_updated:
                  value:
                    external_template_id: "d05a44f0-a7cf-471a-bcb6-63054800a367"
                    version: "3"
                    campaigns_updated: false
                    message: "Campaign update is not supported when sender details differ across this template's versions. The template was saved as a new version, but campaigns stay on their current version."
        '400':
          description: This response is returned when the required parameters are missing from the request or when the provided parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_id:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Invalid template id"
                      details:
                        - code: "MissingValue"
                          target: "9925c8"
                          message: "9925c8 is invalid template id."
                      request_id: "12345requestid"
                limit_breach:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Maximum Template limit exceeded"
                      details:
                        - code: "NotSupported"
                          target: "Maximum Template limit exceeded"
                          message: "You have already created maximum allowed template allowed for client"
                      request_id: "eLeZXIlW"
                invalid_team_name:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "team_name"
                          message: "team_name\"team2\" does not exist in this workspace"
                      request_id: "NRwyBXpk"
                sender_details_removed:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "sender_details"
                          message: "Sender details cannot be removed once added; they can only be changed. Send new values instead of empty ones; there is no way to unset them."
                      request_id: "Rv6KdP2s"
                sender_details_changed_in_place:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "update_latest_version"
                          message: "Sender details cannot be changed in place. Resend with update_latest_version=false to save them as a new version."
                      request_id: "Jc8WnF3q"
                in_place_update_moves_campaigns:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "NotSupported"
                          target: "update_latest_version"
                          message: "Cannot update in place: campaigns on older versions would move onto a version with different sender details. Resend with update_latest_version=false."
                      request_id: "Tx4BhL9m"
                connector_mismatch_with_group_templates:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Validation failed because of invalid request data"
                      details:
                        - code: "InvalidValue"
                          target: "connector"
                          message: "Connector must match the locale / variation templates of the group: locale fr variation 2 uses Sendgrid (sg_secondary). Update that locale / variation template to the new connector first, or keep the current connector."
                      request_id: "Yp7GzE1k"
        '401':
          description: This response is returned when the authorization parameters are missing in the HTTP Auth Header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  description:
                    type: string
              examples:
                auth_fail:
                  value:
                    title: "Authentication required"
                    description: "MOE-APPKEY missing in Authentication Header"
        '415':
          description: This response is returned when the header Content-Type is not provided/is not supported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  description:
                    type: string
              examples:
                unsupported:
                  value:
                    title: "Unsupported media type"
                    description: "Content type is not supported"
        '429':
          description: This response is returned when the number of requests per minute has exceeded the rate limit, or the number of templates has exceeded the allowed quota per channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  value:
                    response_id: "response_id_example"
                    type: "custom_template"
                    error:
                      code: "Too Many Requests"
                      message: "API rate limit breached. Current limit: n/m mins"
        '500':
          description: This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  message:
                    type: string
              examples:
                server_error:
                  value:
                    title: "Internal Server Error"
                    message: "An unexpected error was encountered while processing this request. Please contact MoEngage Team"

  /custom-templates/email/search:
    post:
      summary: Search Email Template
      description: |
        This API searches the email templates created in your MoEngage account.

      operationId: searchEmailTemplate
      tags:
        - Email Templates
      x-mint:
        content: |
        
          <Note>
          **Note**

          We are introducing mandatory pagination, effective November 15, 2025, all calls to this API must include the following two parameters:
          * `page`: The page number of the results you wish to fetch.
          * `entries`: The number of templates to return per page, with a maximum value of 15.

          Please update all integrations to include these parameters. API requests submitted without them after the effective date will result in an error and fail to execute.
          </Note>

          #### Rate Limit
          The rate limit is 100 Requests Per Minute.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                **Note:**

                - `page` and `entries` are mandatory effective November 15, 2025. All other fields are optional.

                - You can send empty filters to fetch all the email templates.

                - You can send only `template_ids` if you want specific older versions of the email template. In other cases, you will receive the latest version of the template.

                - By default, the `is_default_template_of_group` flag is set to "true" for the default (parent) template and "false" for child templates.

                - The connector details filters (`connector_name`, `connector_type`, `from_address`, and `include_templates_without_connector`) are currently released behind a feature flag and may not be available for your workspace. Contact your MoEngage Customer Success Manager (CSM) or the Support team to get them enabled.
              required:
                - page
                - entries
              properties:
                page:
                  type: integer
                  description: This field contains the index of the pages to be returned in the search result.
                entries:
                  type: integer
                  description: This field contains the number of entries per page in the search result. Maximum value is 15.
                  maximum: 15
                template_name:
                  type: string
                  description: This field indicates the name of the template. When this value is specified, the template that matches the name specified in this field will be returned.
                template_source:
                  type: array
                  items:
                    type: string
                  description: This field indicates the template source that created the template. For example ["API", "MOENGAGE"]. When specified, the templates whose source matches that specified in this list will be returned.
                template_version:
                  type: string
                  description: This field indicates the template version. When specified, the template whose template version matches that specified in this field will be returned.
                template_id:
                  type: string
                  description: This field indicates the template id. When specified, the template whose template id matches that specified in this field will be returned.
                template_type:
                  type: array
                  items:
                    type: string
                  description: |
                    This field indicates whether the template is a custom one or a pre-built one.
                    Allowed values: CUSTOM, PRE_BUILT.
                    When specified, the templates whose template type matches that specified in this list will be returned.
                created_by:
                  type: array
                  items:
                    type: string
                  description: |
                    This field indicates the user who created the template. When specified, the templates for which the created_by user information matches that specified in this list will be returned.
                    Example: ["user1@moengage.com", "user2@moengage.com"]
                updated_by:
                  type: array
                  items:
                    type: string
                  description: |
                    This field indicates the user who updated the template. When specified, the templates for which the updated_by user information matches that specified in this list will be returned.
                    Example: ["user1@moengage.com", "user2@moengage.com"]
                sort_params:
                  type: array
                  items:
                    type: object
                  description: |
                    This field indicates the sorting parameters for the search result and the sort order.
                    Example: "sort_params":[{"template_name": "ASCENDING","last_modified_date": "ASCENDING","last_modified_by": "ASCENDING"}]
                external_template_ids:
                  type: array
                  items:
                    type: object
                    properties:
                      external_template_id:
                        type: string
                      version:
                        type: integer
                  description: |
                    This field indicates the list of the template ids and their versions that must be fetched. When this value is specified, the template that matches the id and version specified in this field will be returned.
                group_id:
                  type: string
                  description: |
                    This field indicates the group ID of the parent template.
                    Pass the Group ID of the parent (default) template of the group to fetch all templates associated with that group.
                    The "external_template_id" generated for the parent template acts as its group ID.
                is_grouped_response:
                  type: boolean
                  description: |
                    If the value is "true", this API fetches only the default template data, including additional fields such as unique locale count, unique variations, total templates in the group, and all individual templates that are not part of any group.
                    If the value is "false", this API will fetch all individual templates and their template data.
                is_count_required:
                  type: boolean
                  description: If the value is "true", this API fetches total templates of the same request to support pagination on the UI.
                team_names:
                  type: array
                  items:
                    type: string
                  description: |
                    This field contains the list of team names for which you want to fetch templates.

                    When specified, only the templates belonging to the teams listed here are returned. Unlike the `team_name` field on the create and update APIs, this parameter is not gated behind a feature flag — it is available to any workspace that has teams enabled.
                  example: ["team1", "team2"]
                connector_name:
                  type: array
                  items:
                    type: string
                  description: This field contains the list of email connector names. When specified, the templates whose connector name matches one of the names in this list will be returned.
                  example: ["sg_primary"]
                connector_type:
                  type: array
                  items:
                    type: string
                    enum:
                      - SENDGRID
                      - AMAZON_SES
                      - SPARKPOST
                      - MANDRILL
                      - CUSTOM_SMTP
                      - CUSTOM_API
                      - NETCORE
                  description: This field contains the list of email connector types. When specified, the templates whose connector type matches one of the types in this list will be returned.
                  example: ["SENDGRID"]
                from_address:
                  type: array
                  items:
                    type: string
                  description: This field contains the list of from email addresses. When specified, the templates whose from email address matches one of the addresses in this list will be returned.
                  example: ["offers@brand.com"]
                include_templates_without_connector:
                  type: boolean
                  default: false
                  description: |
                    If the value is "true", this API also returns templates that have no sender details saved. This field works only with the `connector_name`, `connector_type`, or `from_address` filter, and has no effect on its own.
            examples:
              Search by team names:
                summary: Search by team names
                value:
                  team_names: ["team1", "team2"]
                  page: 1
                  entries: 15
              Search by connector:
                summary: Search by connector
                value:
                  connector_name: ["sg_primary"]
                  include_templates_without_connector: true
                  page: 1
                  entries: 15
      responses:
        '200':
          description: This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: |
                      This field contains the list of email templates that satisfy the search criteria.
                      For information about the template, refer to Basic Details and Meta Info.
                    items:
                      type: object
                      properties:
                        external_template_id:
                          type: string
                        version:
                          type: integer
                        meta_info:
                          $ref: '#/components/schemas/MetaInfo'
                        basic_details:
                          $ref: '#/components/schemas/SearchBasicDetails'
                        created_by:
                          type: string
                        created_at:
                          type: string
                        updated_by:
                          type: string
                        updated_at:
                          type: string
                  error:
                    type: object
                    description: This field contains the reason for the request's failure.
                    properties:
                      code:
                        type: string
                        description: This field contains the error code that provides a brief explanation of the error and is a String.
                      message:
                        type: string
                        description: This field describes why the request has failed and is a String.
                      details:
                        type: array
                        description: This is a List of the error details objects.
                        items:
                          type: object
                      request_id:
                        type: string
                        description: This field contains the unique id pertaining to the request.
              examples:
                success:
                  value:
                    data:
                      - external_template_id: "{{external_template_id}}"
                        version: 2
                        basic_details:
                          email_content: "<!DOCTYPE html><html><head><title>Sample Webpage</title></head><body><h1>Welcome to My Sample Webpage 1</h1><p>This is a small example of an HTML webpage.</p><p>Below is an unordered list:</p><ul><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul><p>Here's an image:</p><img src=\"https://example.com/sample-image.jpg\" alt=\"Sample Image\"><p>Visit our <a href=\"https://www.example.com\">website</a> for more information.</p></body></html>"
                          subject: "Hi, Test subject 1"
                          attachments: []
                          thumbnail_url: "https://img.freepik.com/free-vector/bright-yellow-sunflower-design-decorations_1308-130330.jpg"
                          sender_name: "test sender 1"
                          connector:
                            connector_type: "SENDGRID"
                            connector_name: "sg_primary"
                          from_address: "offers@brand.com"
                          reply_to_address: "support@brand.com"
                        meta_info:
                          template_id: "{{template_id}}"
                          template_name: "test_template_1"
                          template_version: "0"
                          created_by: "user1@moengage.com"
        '400':
          description: This response is returned when the required parameters are missing from the request, when the provided parameters are invalid, or when a template already exists with the same version, name, or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_field:
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Invalid Field Value"
                      details:
                        - code: "InvalidValue"
                          target: ["template_name", "created_by"]
                          message: "Some of the field values are invalid"
                      request_id: "{{request_id}}"
        '401':
          description: This response is returned when the authorization parameters are missing in the HTTP Auth Header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                auth_fail:
                  value:
                    error:
                      code: "401 Unauthorized"
                      message: "Authentication required"
                      details:
                        - code: "InvalidValue"
                          target: "APP_ID"
                          message: "Invalid APP_ID is provided."
                      request_id: "{{request_id}}"
        '429':
          description: This response is returned when the number of requests per minute has exceeded the rate limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_id:
                    type: string
                  type:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                rate_limit:
                  value:
                    response_id: "{{response_id}}"
                    type: "custom_template"
                    error:
                      code: "Too Many Requests"
                      message: "API rate limit breached. Current limit: n/m mins"
        '500':
          description: This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  message:
                    type: string
              examples:
                server_error:
                  value:
                    title: "Internal Server Error"
                    message: "An unexpected error was encountered while processing this request. Please contact MoEngage Team"