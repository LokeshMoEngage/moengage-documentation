openapi: 3.0.0

info:
  title: Offer Decisioning Public API - v5
  version: 5.0.0
  description: |
    The Offerings API lets you create, update, and list offerings for Offer Decisioning, and
    list the personalization templates available for offering content. For lifecycle, rate limits,
    idempotency, and error details, see the [Offerings Overview](/api/offerings/offerings-overview).

servers:
  - url: https://api-{dc}.moengage.com
    variables:
      dc:
        default: "01"
        description: >
          MoEngage data center identifier. Replace with your assigned DC number.
          Full example: https://api-01.moengage.com

paths:
  /v5/offers:
    get:
      security:
        - Basic Auth (View): []
        - OAuth 2.0 (View): []
      operationId: listPublicOfferings
      summary: List Offerings
      description: |
        Fetch all offerings in the workspace. Returns a summary of each offering — ID, name,
        status, tags, and creation metadata.

      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          List all offer campaigns in the workspace. Use this as the first step to discover
          existing offerings and their IDs before calling update_offering or inspecting details.

          Returns a paginated summary — ID, display_name, status, tags, created_at, created_by.
          Use the fields parameter to request only the fields you need (reduces token usage).

          Typical agent flow:
            1. Call list_offerings (optionally filter by status_in=draft to find offerings you can update, or display_name_contains)
            2. Pick the offering ID (it starts with offer_) from the results
            3. Call update_offering with that ID to modify the offering

          Pagination: pass next_cursor from the pagination object on the next call.
          Keep paginating until has_more is false.
        param_overrides:
          status_in:
            description: |
              Filter by lifecycle status. Use 'active' to find offerings currently being
              served to users. Use 'scheduled' for upcoming ones. Omit to return all statuses
              including drafts. Valid values: active, scheduled, expired, archived, draft.
              Example: status_in=active,scheduled
          cursor:
            description: |
              An opaque pagination token used to retrieve the next page of results.

              * **Initial Request:** Omit this parameter entirely on the first call to fetch the beginning of the list.
              * **Subsequent Pages:** Pass the exact string received from the `next_cursor` field of the immediate previous response.
              * **Handling:** Pass this token completely verbatim. Do not decode, alter, or modify the string in any way.
          fields:
            description: |
              Comma-separated list of fields to return. Omit for all six fields.
              Use to minimise token usage. Valid values: `id`, `display_name`, `status`, `tags`, `created_at`, `created_by`.
              Example: fields=id,display_name,status
          limit:
            description: |
              The number of offerings to return per paginated response.

      tags:
        - Public Offerings
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: >
            Look up a single offering by its exact prefixed ID (it starts with `offer_`).
            Use this when you already know the offering ID and want to confirm it exists
            before updating it.
        - name: display_name_contains
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: >
            Find offerings whose display name contains specific text (case-insensitive). For example, pass
            "summer" to find all summer-related offerings.
        - name: status_in
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter by lifecycle status.
            Valid values: active, scheduled, expired, archived, draft.
            Example: status_in=active,scheduled
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >
            Filter to offerings that have ALL of the specified tags, by tag name.
            Repeat the parameter for multiple tags: `tags=SUMMER_SALE&tags=NEW_USER_ACQUISITION`.
        - name: created_date_gte
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            List offerings created on or after this date. Format: YYYY-MM-DD.
        - name: created_date_lte
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            List offerings created on or before this date. Format: YYYY-MM-DD.
        - name: created_by
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >
            Filter offerings created by specific team members. Pass one or more email
            addresses. Example: created_by=john.doe@example.com,marketing-team@example.com
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: >
            Request only the fields you need.
            Example: fields=id,display_name,status returns only those three fields per item.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Pagination cursor returned as `next_cursor` in the previous response.
            Omit on the first request. When `next_cursor` is `null` in the response, you have reached the last page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page. Default 20, max 100.
        - name: X-MOE-Request-Id
          in: header
          required: false
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the `X-MOE-Request-Id` response
            header.
      responses:
        '200':
          description: Paginated list of offerings.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Trace ID echoed from the gateway.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 150
              description: Maximum requests allowed in the current window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                type: object
                required: [response_id, type, data, pagination]
                properties:
                  response_id:
                    type: string
                    description: >
                      Format: `resp_<X-MOE-Request-Id>` header value (auto-generated UUID if the `X-MOE-Request-Id` header was not part of the request body).
                  type:
                    type: string
                    enum: [offer]
                  data:
                    type: array
                    description: List of offering summaries matching the applied filters.
                    items:
                      $ref: '#/components/schemas/OfferingListItem'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              example:
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                type: offer
                data:
                  - id: "offer_65a1c0de9b2f4a7d8e3c5f10"
                    display_name: Summer_Sale_Promo_2026
                    status: active
                    tags: ["SUMMER_SALE", "NEW_USER_ACQUISITION"]
                    created_at: "2026-06-23T12:29:41.225270281Z"
                    created_by: marketing-team@example.com
                  - id: "offer_65a1c0de9b2f4a7d8e3c5f11"
                    display_name: Homepage_Banner_AB_Test
                    status: scheduled
                    created_at: "2026-06-23T12:29:41.225270281Z"
                    created_by: growth-team@example.com
                pagination:
                  next_cursor: "b2ZmZXJzOjY1YTFjMGRlOWIyZjRhN2Q4ZTNjNWYxMQ=="
                  limit: 20
                  has_more: true
                  total_count: 42
        '400':
          description: |
            Invalid query parameter. Possible error codes in `error.details[].code`:
            - `OUT_OF_RANGE` — `limit` > 100, or `name_contains` > 100 chars.
            - `INVALID_CURSOR` — `cursor` is present but malformed (not valid base64, or corrupted segment/id).
            - `INVALID_ENUM_VALUE` — unrecognised value in `status_in`.
            - `INVALID_FIELDS_PARAM` — unrecognised field name in `fields`.
            - `INVALID_TYPE` — `created_date_gte` or `created_date_lte` not in YYYY-MM-DD format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: One or more query parameters are invalid.
                  doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                  details:
                    - code: INVALID_ENUM_VALUE
                      target: status_in
                      message: "'invalid_status' is not a valid status. Allowed values: active, scheduled, expired, archived, draft."
                      doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error code: `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      security:
        - Basic Auth (Create & Manage): []
        - OAuth 2.0 (Create & Manage): []
      operationId: createPublicOffering
      summary: Create Offering
      description: |
        Create a new Offering in the workspace.

        **Creating an offering with a template:** call [List Offer Templates](/api/public-offerings/list-offer-templates) to find the template `id`, then [Get Offer Template](/api/public-offerings/get-offer-template) to read its fields (`template_config`). In your request, set the content `type` to `template` and send:

        1. `value`: the field values, keyed by each field's `outputKeyName`. Include every required field. For a dropdown field, use the option's `value`.
        2. `meta.templateId`: the template `id`.
        3. `meta.metaConfigObject`: the `template_config`, with each field's `value` set to the same value you send in `value`. Validate Offering returns `TEMPLATE_VALUE_MISMATCH` when they differ.

      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Create a new offering in the workspace.

          Key constraints:
            - start_datetime and expiry_datetime must use the UTC "Z" suffix (e.g. "2027-06-01T00:00:00Z").
              Offset strings like "+05:30" are not accepted.
            - tags are tag names (for example "SUMMER_SALE"); use the names of tags that already exist in the workspace.
            - variation_meta can be updated via PATCH while the offering is a draft. See update_offering.
            - display_name: 5–100 chars after trimming spaces; must start with a letter and contain at least one letter;
              allowed characters are letters, digits, spaces, and - & _ % ( ).

          In-session targeting (optional): include insession_attr_info to target visitors by in-session attributes
          (key-value pairs passed at decision time). Structure: filters.included_filters and/or filters.excluded_filters,
          each with filter_operator ("and" or "or") and a filters list. Each entry is a single attribute (filter_type
          "query_parameter" with data_type, name, operator, value, negate) or a group (filter_type "nested_filters" with its
          own filter_operator and filters). data_type: string, double, bool, datetime, array_string, array_double;
          case_sensitive applies to string and array_string. Up to 10 attributes per group and 5 groups per offering.

          Always supply a unique Idempotency-Key (UUID v4) header to prevent duplicate offerings
          on retries. The same key within 24 hours returns the original 201 response.

          For a simple single-variant offering with no A/B test:
            - Set variation_meta.type = SMV, split = {variation_1: 100}
            - Put content in offer_content.locales["0"].variations.variation_1
            - Locale key must be "0" for single-locale offerings (not "default" or "en")
            - Variation keys must follow the variation_N format (e.g. variation_1, variation_2). Other formats are rejected.
        param_overrides:
          variation_meta:
            description: |
              A/B test configuration. For a simple offering (no A/B test), use:
                type: SMV, split: {variation_1: 100}
              Variation keys must follow the variation_N format (e.g. variation_1, variation_2). Other formats are rejected.
              Maximum 5 variations per offering.
              For A/B test (SMV): split values must sum to exactly 100 inclusive of control group allocation(checked when the offering is validated before it is published).
              For AI optimization (DMV): do not send smv_distribution — the server learns the allocation over time (sending it returns IMMUTABLE_FIELD).
              Only draft offerings can be updated via PATCH, and all variation_meta fields are editable on a draft.
          offer_content:
            description: |
              Content payload. Use the locales["0"] nested format for single-locale offerings:
                {"locales": {"0": {"variations": {"variation_1": {"content_1": {"type": "json", "value": "..."}}}}}}
              The locale key "0" is required for single-locale — do not use "default" or "en".
              Variation keys in offer_content must exactly match the split keys (checked when the offering is validated before it is published).
              Variation keys must follow the variation_N format (e.g. variation_1, variation_2).
          scheduling:
            description: |
              Schedule window. start_datetime and expiry_datetime **MUST** use
              UTC "Z" suffix (e.g. "2027-06-01T00:00:00Z"). Offset strings like "+05:30" return INVALID_TYPE.
          segment_info:
            description: |
              Audience targeting. To target all users, use the built-in moe_all_users segment:
                {"filters": {"included_filters": {"filter_operator": "and", "filters": [{"filter_type": "custom_segments", "id": "moe_all_users", "name": "All Users"}]}}}
              For attribute-based targeting, use filter_type: "user_attributes" with data_type required.
      tags:
        - Public Offerings
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          example: "9e3c1a52-6f7b-4d08-b2a4-71c5e8f90d36"
          schema:
            type: string
            format: uuid
          description: >
            UUID v4 idempotency token. Submitting the same key within 24 hours returns the
            original `201 response` without re-creating the Offering. A different body hash on
            the same key returns `409 IDEMPOTENCY_CONFLICT`. A concurrent in-progress request
            with the same key returns `409 DUPLICATE_IDEMPOTENCY_KEY`.
        - name: X-MOE-Request-Id
          in: header
          required: false
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header. Use this to correlate client requests with server-side logs. If you also send `request_id`
            in the body, the body value is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientOfferCreateRequest'
            examples:
              jsonSingleVariantNoCapping:
                summary: "Basic offering with JSON content"
                value:
                  display_name: Summer_Sale
                  description: Summer sale discount offers
                  priority: 50
                  created_by: john.doe@example.com
                  request_id: 5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                  status: draft
                  scheduling:
                    start_datetime: '2027-06-01T00:00:00Z'
                    expiry_datetime: '2027-08-31T23:59:00Z'
                    timezone: Asia/Kolkata
                  segment_info:
                    filters:
                      included_filters:
                        filter_operator: and
                        filters:
                        - filter_type: custom_segments
                          name: custom_segment
                          id: 65a1c0de9b2f4a7d8e3c5f2a
                  offer_content:
                    content_1:
                      type: json
                      value: '{"discount":"10%"}'
                  variation_meta:
                    type: SMV
                    control_group:
                      is_enabled: false
                      percentage: 0
                    smv_distribution:
                      split:
                        variation_1: 100
                  capping_rules: {}
                  is_global_control_enabled: false
                  imp_track_hours: 36
              jsonMultiVariantWithCapping:
                summary: "A/B test with a control group and caps"
                value:
                  display_name: Summer_Sale
                  description: Summer sale discount offers
                  priority: 50
                  created_by: john.doe@example.com
                  request_id: 5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                  status: draft
                  scheduling:
                    start_datetime: '2027-06-01T00:00:00Z'
                    expiry_datetime: '2027-08-31T23:59:00Z'
                    timezone: Asia/Kolkata
                  segment_info:
                    filters:
                      included_filters:
                        filter_operator: and
                        filters:
                        - filter_type: custom_segments
                          name: custom_segment
                          id: 65a1c0de9b2f4a7d8e3c5f2a
                  offer_content:
                    locales:
                      '0':
                        variations:
                          variation_1:
                            content_1:
                              type: json
                              value: '{"discount":"10%"}'
                          variation_2:
                            content_1:
                              type: json
                              value: '{"discount":"20%"}'
                  variation_meta:
                    type: SMV
                    control_group:
                      is_enabled: true
                      percentage: 10
                    smv_distribution:
                      split:
                        variation_1: 50
                        variation_2: 50
                  capping_rules:
                    overall:
                      enabled: true
                      limit_value: 1
                      limit_schedule: DAILY
                    user_level:
                      enabled: true
                      limit_value: 15
                      limit_schedule: MONTHLY
                  is_global_control_enabled: true
                  imp_track_hours: 36
              jsonWithConversionGoal:
                summary: "Offering with a conversion goal (Purchase) configured"
                value:
                  display_name: Summer_Sale_Conversion
                  description: Summer sale offer with a purchase conversion goal
                  priority: 50
                  created_by: john.doe@example.com
                  request_id: 5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                  status: draft
                  scheduling:
                    start_datetime: '2027-06-01T00:00:00Z'
                    expiry_datetime: '2027-08-31T23:59:00Z'
                    timezone: Asia/Kolkata
                  segment_info:
                    filters:
                      included_filters:
                        filter_operator: and
                        filters:
                        - filter_type: custom_segments
                          name: All Users
                          id: moe_all_users
                  offer_content:
                    content_1:
                      type: json
                      value: '{"discount":"10%"}'
                  variation_meta:
                    type: SMV
                    control_group:
                      is_enabled: false
                      percentage: 0
                    smv_distribution:
                      split:
                        variation_1: 100
                  conversion:
                    primary:
                      goal_name: Purchase
                      action: purchase
                      filter_type: actions
                      attributes:
                        filter_operator: and
                        filters: []
                      is_revenue_tracking: true
                      revenue_amount: order_value
                      revenue_currency: USD
                    secondary: []
                  attribution_multiplier: 1
                  imp_track_hours: 24
              templateSingleVariation:
                summary: "Offering from a template"
                value:
                  display_name: Summer_Banner_Single
                  description: Sample promo banner offer
                  created_by: john.doe@example.com
                  request_id: 5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                  status: draft
                  priority: 10
                  tags:
                  - SUMMER_SALE
                  - NEW_USER_ACQUISITION
                  scheduling:
                    start_datetime: '2027-06-01T00:00:00Z'
                    expiry_datetime: '2027-08-31T23:59:00Z'
                    timezone: Asia/Kolkata
                  segment_info:
                    filters:
                      included_filters:
                        filter_operator: and
                        filters:
                        - filter_type: custom_segments
                          name: All Users
                          id: moe_all_users
                  offer_content:
                    content_1:
                      type: template
                      value:
                        id: summer-banner-1
                        title: Summer sale is on
                        description: Save 20% on your first order.
                        cta_label: Shop now
                        cta_url: https://example.com/summer-sale
                        cta_target: _blank
                        theme: light
                      meta:
                        templateId: promo_banner_demo
                        metaConfigObject:
                          id:
                            label: ID
                            outputKeyName: id
                            value: summer-banner-1
                            isValid: true
                            errorMessage: []
                            dataType: string
                            validations:
                              REQUIRED: true
                          title:
                            label: Title
                            outputKeyName: title
                            value: Summer sale is on
                            isValid: true
                            errorMessage: []
                            dataType: string
                            validations:
                              REQUIRED: true
                          description:
                            label: Description
                            outputKeyName: description
                            value: Save 20% on your first order.
                            isValid: true
                            errorMessage: []
                            dataType: string
                            validations: {}
                          cta_label:
                            label: CTA Label
                            outputKeyName: cta_label
                            value: Shop now
                            isValid: true
                            errorMessage: []
                            dataType: string
                            validations:
                              REQUIRED: true
                          cta_url:
                            label: CTA URL
                            outputKeyName: cta_url
                            value: https://example.com/summer-sale
                            isValid: true
                            errorMessage: []
                            dataType: string
                            validations:
                              REQUIRED: true
                          cta_target:
                            label: CTA Target
                            outputKeyName: cta_target
                            value: _blank
                            isValid: true
                            errorMessage: []
                            dataType: dropdown
                            validations:
                              REQUIRED: true
                            options:
                            - id: same_tab
                              value: _self
                              label: Same tab
                            - id: new_tab
                              value: _blank
                              label: New tab
                          theme:
                            label: Theme
                            outputKeyName: theme
                            value: light
                            isValid: true
                            errorMessage: []
                            dataType: dropdown
                            validations: {}
                            options:
                            - id: light_theme
                              value: light
                              label: Light
                            - id: dark_theme
                              value: dark
                              label: Dark
                  variation_meta:
                    type: SMV
                    control_group:
                      is_enabled: false
                      percentage: 0
                    smv_distribution:
                      split:
                        variation_1: 100
                  capping_rules:
                    overall:
                      enabled: true
                      limit_value: 10
                      limit_schedule: WEEKLY
                    user_level:
                      enabled: true
                      limit_value: 1
                      limit_schedule: DAILY
              OfferingTemplateManualAB:
                summary: "A/B test two template designs (50/50)"
                value:
                  display_name: Summer_Banner_Manual_AB
                  created_by: john.doe@example.com
                  request_id: 5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                  status: draft
                  priority: 10
                  scheduling:
                    start_datetime: '2027-06-01T00:00:00Z'
                    expiry_datetime: '2027-08-31T23:59:00Z'
                    timezone: Asia/Kolkata
                  segment_info:
                    filters:
                      included_filters:
                        filter_operator: and
                        filters:
                        - filter_type: custom_segments
                          name: All Users
                          id: moe_all_users
                  offer_content:
                    locales:
                      '0':
                        variations:
                          variation_1:
                            content_1:
                              type: template
                              value:
                                id: summer-banner-1
                                title: Summer sale is on
                                description: Save 20% on your first order.
                                cta_label: Shop now
                                cta_url: https://example.com/summer-sale
                                cta_target: _blank
                                theme: light
                              meta:
                                templateId: promo_banner_demo
                                metaConfigObject:
                                  id:
                                    label: ID
                                    outputKeyName: id
                                    value: summer-banner-1
                                    isValid: true
                                    errorMessage: []
                                    dataType: string
                                    validations:
                                      REQUIRED: true
                                  title:
                                    label: Title
                                    outputKeyName: title
                                    value: Summer sale is on
                                    isValid: true
                                    errorMessage: []
                                    dataType: string
                                    validations:
                                      REQUIRED: true
                                  description:
                                    label: Description
                                    outputKeyName: description
                                    value: Save 20% on your first order.
