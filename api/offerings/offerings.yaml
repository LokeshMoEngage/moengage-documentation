      responses:
        '200':
          description: Offering updated successfully.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Echoed trace ID.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 100
              description: Maximum requests allowed in the current window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOfferPatchResponse'
        '400':
          description: |
            Validation errors. All errors are collected before returning, so a single `400` response may contain multiple `details` entries. Validation errors are returned as `VALIDATION_FAILED`, with the specific code in `error.details[].code`.

            The API saves drafts without checking completeness. Required fields, scheduling, split totals, tags, conversion settings, and required template fields are checked by [Validate Offering](/api/public-offerings/validate-offering) and when the offering is published.

            Possible error codes:
            - `REQUIRED_FIELD_MISSING` — `updated_by` or `last_updated_at` is absent, or no request ID was sent (neither `request_id` in the body nor the `X-MOE-Request-Id` header). The `target` field identifies the missing field.
            - `INVALID_TYPE` — wrong type or format (e.g. `scheduling.start_datetime` is not a valid ISO 8601 datetime with UTC "Z" suffix).
            - `OUT_OF_RANGE` — numeric field outside its allowed range (e.g. `priority` outside 1–100, `control_group.percentage` outside 1–99 when the control group is enabled).
            - `INVALID_ENUM_VALUE` — enum field has an unrecognised value (e.g. unrecognised `variation_meta.type`).
            - `UNRECOGNISED_FIELD` — the request body contains a field the API doesn't recognise.
            - `INVALID_STATUS` — `status` can't be changed through the API. Remove `status` from the request.
            - `IMMUTABLE_FIELD` — the request tries to change a field that can't be changed: `name` (use `display_name` to rename the offering), or `variation_meta.smv_distribution` sent when `variation_meta.type` is `DMV` (the split is allocated automatically).
            - `INVALID_OFFER_NAME` — `display_name` does not follow the naming rules: 5–100 characters after trimming spaces, starts with a letter, and contains only letters, digits, spaces, and the characters `- & _ % ( )`.
            - `INVALID_TIMEZONE` — `scheduling.timezone` is present but not a valid IANA timezone name.
            - `MISSING_IDEMPOTENCY_KEY` — `Idempotency-Key` header is absent.
            - `INVALID_IDEMPOTENCY_KEY` — `Idempotency-Key` is present but not a valid UUID v4.
            - `INVALID_STATUS_TRANSITION` — the offering isn't a draft. Only drafts can be edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  summary: "status sent in an update"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: INVALID_STATUS
                        target: status
                        message: 'status has an unsupported value: published. Update Offering does not accept status.'
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                nameNotAllowed:
                  summary: "name sent in an update"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: IMMUTABLE_FIELD
                        target: name
                        message: '''name'' cannot be modified after creation. Only ''display_name'' is editable.'
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                notADraft:
                  summary: "Offering is not a draft"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: INVALID_STATUS_TRANSITION
                        target: status
                        message: This offering is live and can no longer be edited. Only drafts can be edited.
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '401':
          description: |
            Authentication failure. Two sources produce 401 on this endpoint:
            - **Gateway (APISIX)** — credentials missing or invalid. Returns `Content-Type: text/plain`
              with body `{"code":"ER001","target":"Authentication Invalid","message":"..."}`.
            - **Service** — credentials passed the gateway but the injected `X-MOE-Tenant-ID` header
              is missing (request bypassed gateway). Returns `Content-Type: application/json`.
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) authentication failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error codes: `EXPIRED_OFFERING`
              (the offering is past its `expiry_datetime`), `INSUFFICIENT_SCOPE` (the API key doesn't have
              the **Create & Manage** permission), or `FEATURE_DISABLED` (the Offerings feature is
              not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredOffering:
                  summary: Offering has expired
                  value:
                    error:
                      code: EXPIRED_OFFERING
                      message: Offering has expired and cannot be updated.
                      doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview#errors"
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '404':
          description: Offering not found (OFFER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                offerNotFound:
                  summary: "Offering not found"
                  value:
                    error:
                      code: OFFER_NOT_FOUND
                      message: Offering not found.
                      target: offering
                      details:
                      - code: OFFER_NOT_FOUND
                        target: offer_id
                        message: Offering not found.
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '409':
          description: |
            Conflict. Three distinct error codes are possible:

            **DUPLICATE_IDEMPOTENCY_KEY** — a request with the same Idempotency-Key is already
            in-flight (concurrent duplicate). Wait for the first request to complete before retrying.

            **IDEMPOTENCY_CONFLICT** — the Idempotency-Key was already used within the 24-hour
            window but the request body hash differs from the original request. Use a new
            Idempotency-Key to submit a different payload.

            **VERSION_CONFLICT** — the `last_updated_at` value doesn't match the current version of
            the offering. Call Get Offering for the offering, copy the `updated_at` value from the
            response, and send it as `last_updated_at`. This check runs before the offering's state is
            checked, so a stale `last_updated_at` returns `VERSION_CONFLICT` before any other error about
            the offering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateInFlight:
                  summary: Concurrent duplicate (in-flight)
                  value:
                    error:
                      code: DUPLICATE_IDEMPOTENCY_KEY
                      message: A request with this Idempotency-Key is already being processed.
                      doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                      target: Idempotency-Key
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                bodyMismatch:
                  summary: Same key, different body
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: The Idempotency-Key was already used with a different request body. Use a new key.
                      doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                      target: Idempotency-Key
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                versionConflict:
                  summary: last_updated_at does not match the current version
                  value:
                    error:
                      code: VERSION_CONFLICT
                      message: "A newer version of this draft is available. Please reload to continue."
                      doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview#errors"
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/{offer_id}/validate:
    post:
      security:
        - Basic Auth (View): []
        - OAuth 2.0 (View): []
      operationId: validatePublicOffering
      summary: Validate Offering
      description: |
        Check whether a draft offering is ready to publish. This runs the same validations that apply when an offering is published and returns the errors that would block it, so you can fix a draft before publishing it from the MoEngage dashboard.

        Create Offering and Update Offering save drafts without checking completeness. Call this endpoint after you create or update a draft to find missing or invalid fields. The request body is empty (`{}`).

        A failed validation is a normal response: `data.valid` is `false` and `data.errors` lists what to fix. Repeat Update Offering and Validate Offering until `data.valid` is `true`.

        Validate Offering also checks that each template field's `value` matches its value in `meta.metaConfigObject`, and the in-session attribute limits (up to 10 attributes in a group and up to 5 groups per offering).
      tags:
        - Public Offerings
      parameters:
        - name: offer_id
          in: path
          required: true
          example: "offer_65a1c0de9b2f4a7d8e3c5f10"
          schema:
            type: string
          description: >
            The unique ID of the offering to validate. Must include the `offer_` prefix
            (the ID starts with `offer_`). You can retrieve the prefixed ID from the
            `data[].id` field in the [List Offerings API](/api/public-offerings/list-offerings) response.
        - name: X-MOE-Request-Id
          in: header
          required: false
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the `X-MOE-Request-Id` response
            header and in server logs. A request ID is required, either this header or `request_id`
            in the body. If you send both, the body value is used.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Send an empty object. No fields are needed to validate an offering.
              properties:
                request_id:
                  type: string
                  description: |
                    Optional. A unique ID for this request, used to trace it in logs and support tickets. If you omit it, the `X-MOE-Request-Id` header is used.
                  example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
            example: {}
      responses:
        '200':
          description: |
            Validation result. When `data.valid` is `false`, `data.errors` lists each problem with a `code`, the `target` field, and a `message`. All errors are collected, so one response can list several.

            Possible `data.errors[].code` values:
            - `REQUIRED_FIELD_MISSING` — a field needed to publish is absent (for example `priority`, `scheduling`, `segment_info`, `offer_content`, `variation_meta`, or `attribution_multiplier` when a conversion goal is set). The `target` identifies the field.
            - `INVALID_TYPE` — a field has the wrong type or format (e.g. `content_1.value` is not a JSON object when `type` is `template`; or `scheduling.start_datetime` is not a valid ISO 8601 datetime with UTC "Z" suffix).
            - `OUT_OF_RANGE` — numeric field outside its allowed range (e.g. `priority` outside 1–100, `control_group.percentage` outside 1–99).
            - `INVALID_ENUM_VALUE` — enum field has an unrecognised value.
            - `INVALID_OFFER_NAME` — `display_name` contains characters other than alphanumeric characters and underscores. Spaces and hyphens are not allowed.
            - `INVALID_SCHEDULING` — `expiry_datetime` is not after `start_datetime`; `start_datetime` is in the past; or `expiry_datetime` is less than 10 minutes in the future.
            - `INVALID_TIMEZONE` — `scheduling.timezone` is present but not a valid IANA timezone name (e.g. `Asia/Kolkata`, `America/New_York`, `UTC`).
            - `SPLIT_KEY_MISMATCH` — keys in `smv_distribution.split` do not match the variation keys used in `offer_content`.
            - `INVALID_SPLIT` — values in `smv_distribution.split` do not sum to exactly 100. Adjust the percentages so the total equals 100.
            - `VARIANT_COUNT_MISMATCH` — count of variants in `offer_content` does not match the keys in `smv_distribution.split`.
            - `INVALID_TEMPLATE_ID` — `meta.templateId` refers to a template ID not registered in the workspace.
            - `MISSING_TEMPLATE_FIELD` — a field marked `REQUIRED` in the template has an empty `value` in `meta.metaConfigObject`. The `target` is `offer_content.content_1.meta.metaConfigObject.<fieldKey>.value` for the flat format, or `offer_content.locales.<locale>.variations.<variant>.content_1.meta.metaConfigObject.<fieldKey>.value` for the nested format.
            - `TEMPLATE_VALUE_MISMATCH` — a field's `value` does not match its `value` in `meta.metaConfigObject`. A required field that is missing from `value` is reported the same way. The `target` is the field's path under `value`.
            - `DUPLICATE_OFFER_NAME` — `display_name` matches an existing non-archived offering in this workspace. Offering names must be unique. Choose a different name.
            - `REVENUE_FIELDS_INCOMPLETE` — `conversion.primary.revenue_amount` or `conversion.primary.revenue_currency` is missing when `is_revenue_tracking` is true.
            - `INVALID_CURRENCY_CODE` — `conversion.primary.revenue_currency` is not a valid ISO 4217 code (e.g. use "USD", "EUR", "INR").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferValidationResponse'
              examples:
                validationFailed:
                  summary: "Validation failed"
                  value:
                    response_id: resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                    type: offer_validation
                    data:
                      valid: false
                      errors:
                      - code: INVALID_ENUM_VALUE
                        target: conversion.primary.filter_type
                        message: 'conversion.primary.filter_type must be ''actions''. Received: ''ACTIONS''.'
                      - code: REQUIRED_FIELD_MISSING
                        target: attribution_multiplier
                        message: attribution_multiplier is required when a conversion goal is set.
                minimalDraft:
                  summary: "Required fields missing"
                  value:
                    response_id: resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                    type: offer_validation
                    data:
                      valid: false
                      errors:
                      - code: REQUIRED_FIELD_MISSING
                        target: offer_content
                        message: offer_content is required.
                      - code: REQUIRED_FIELD_MISSING
                        target: priority
                        message: priority is required.
                      - code: REQUIRED_FIELD_MISSING
                        target: segment_info
                        message: segment_info is required.
                      - code: REQUIRED_FIELD_MISSING
                        target: variation_meta
                        message: variation_meta is required.
                      - code: REQUIRED_FIELD_MISSING
                        target: scheduling
                        message: scheduling is required.
                templateMismatch:
                  summary: "Template values don't match"
                  value:
                    response_id: resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                    type: offer_validation
                    data:
                      valid: false
                      errors:
                      - code: TEMPLATE_VALUE_MISMATCH
                        target: offer_content.locales.0.variations.variation_1.content_1.value.title
                        message: Field 'title' in value ('Summer sale is on') does not match its value in meta.metaConfigObject ('Your offer title').
                      - code: MISSING_TEMPLATE_FIELD
                        target: offer_content.locales.0.variations.variation_1.content_1.meta.metaConfigObject.cta_url.value
                        message: Required field 'cta_url' is missing or empty in the template configuration for template 'promo_banner_demo'.
                valid:
                  summary: "Ready to publish"
                  value:
                    response_id: resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
                    type: offer_validation
                    data:
                      valid: true
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error code: `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Offering not found (OFFER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                offerNotFound:
                  summary: "Offering not found"
                  value:
                    error:
                      code: OFFER_NOT_FOUND
                      message: Offering not found.
                      target: offering
                      details:
                      - code: OFFER_NOT_FOUND
                        target: offer_id
                        message: Offering not found.
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/templates:
    get:
      security:
        - Basic Auth (View): []
        - OAuth 2.0 (View): []
      operationId: listPublicOfferTemplates
      summary: List Offer Templates
      description: |
        Fetch the personalization templates available in the workspace.

      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          List all personalization templates available in the workspace. Use this before
          creating a template-type content block in an offering, to discover valid template
          IDs and their labels.

          Returns a paginated summary — id, value (same as id), label, template_type.

          Typical agent flow:
            1. Call list_offer_templates to find the template you need (match on label).
            2. Call get_offer_template with its id to read template_config — the template's fields,
               which are required, and the options for dropdown fields.
            3. Build the content block: type "template", value (keyed by outputKeyName),
               meta.templateId, and meta.metaConfigObject. Set each field's value in
               meta.metaConfigObject to the same value you send in value.
            4. Call create_offering or update_offering with that content block.

          Pagination: pass next_cursor from the pagination object on the next call.
          Keep paginating until has_more is false.
        param_overrides:
          cursor:
            description: |
              An opaque pagination token used to retrieve the next page of results.

              * **Initial Request:** Omit this parameter entirely on the first call to fetch the beginning of the list.
              * **Subsequent Pages:** Pass the exact string received from the `next_cursor` field of the immediate previous response.
              * **Handling:** Pass this token completely verbatim. Do not decode, alter, or modify the string in any way.
          limit:
            description: |
              Number of templates per page. Default 20, maximum 100.
      tags:
        - Public Offerings
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            An opaque pagination token used to retrieve the next page of results.

            * **Initial Request:** Omit this parameter entirely on the first call to fetch the beginning of the list.
            * **Subsequent Pages:** Pass the exact string received from the `next_cursor` field of the immediate previous response.
            * **Handling:** Pass this token completely verbatim. Do not decode, alter, or modify the string in any way.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of templates per page. Default 20, maximum 100.
        - name: X-MOE-Request-Id
          in: header
          required: false
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the X-MOE-Request-Id response
            header and in server logs. If omitted, the server generates a trace ID automatically.
      responses:
        '200':
          description: Paginated list of offer templates.
          headers:
            X-MOE-Request-Id:
              schema:
                type: string
              description: Trace ID echoed from the gateway.
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 150
              description: Maximum requests allowed in the current window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_id:
                    type: string
                    description: >
                      Stable trace identifier for this response. Format: "resp_" + X-MOE-Request-Id.
                      Identical on retries that carry the same X-MOE-Request-Id header, enabling
                      client-side deduplication and cross-log correlation.
                  type:
                    type: string
                    enum: [template]
                  data:
                    type: array
                    description: List of templates matching the applied pagination.
                    items:
                      $ref: '#/components/schemas/OfferTemplateListItem'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              example:
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                type: template
                data:
                - id: promo_banner_demo
                  value: promo_banner_demo
                  label: Promo Banner
                  template_type: []
                - id: notice_card_demo
                  value: notice_card_demo
                  label: Notice Card
                  template_type: []
                - id: hero_slide_demo
                  value: hero_slide_demo
                  label: Hero Slide
                  template_type: []
                pagination:
                  next_cursor: null
                  limit: 20
                  has_more: false
                  total_count: 3
        '400':
          description: |
            Invalid query parameter. Possible error codes in `error.details[].code`:
            - `OUT_OF_RANGE` — `limit` > 100.
            - `INVALID_CURSOR` — `cursor` is present but malformed (not valid base64, or corrupted segment/id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: One or more fields failed validation.
                  doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                  details:
                    - code: OUT_OF_RANGE
                      target: limit
                      message: "limit must be between 1 and 100."
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error code: `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/templates/{template_id}:
    get:
      security:
        - Basic Auth (View): []
        - OAuth 2.0 (View): []
      operationId: getPublicOfferTemplate
      summary: Get Offer Template
      description: |
        Retrieve a single personalization template by its ID. The response returns the
        template's full field schema — every field, its type, whether it's required, and
        the valid options for dropdown fields — along with the template's preview HTML.

        Use this before building template-type offering content: fetch the template to see
        exactly which fields it needs and what values are valid, then supply those values in
        [Create Offering](/api/public-offerings/create-offering). To find template IDs, use
        [List Offer Templates](/api/public-offerings/list-offer-templates).
      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Retrieve a single personalization template by its ID, including its full field configuration.

          Use list_offer_templates first to find the template ID if you don't already have it. Use this
          tool before creating or updating an offering with template-type content, to learn which fields
          the template has.

          The response's template_config lists every field of the template, keyed by field name:
            - outputKeyName: the key to use for the field in the content value object.
            - validations.REQUIRED: true means the field must be present and non-empty in value
              (required to publish; each field's value in meta.metaConfigObject must match value). Optional fields can be omitted; only the fields
              in value are returned in the Personalize API response.
            - options: for dropdown fields, the allowed choices — pass an option's value, not its label.

          To build the offering content:
            1. Set content_1.type = "template".
            2. Set content_1.value to an object of field values keyed by outputKeyName (every required
               field, plus any optional fields you want returned).
            3. Set content_1.meta.templateId to the template id.
            4. Set content_1.meta.metaConfigObject to the template_config structure, with each field's value set to
               the same value you send in content_1.value (validation returns TEMPLATE_VALUE_MISMATCH when they
               differ). It also renders the preview in the MoEngage dashboard. For a multi-variation offering,
               include it in every variation.

          When updating template content with update_offering, send metaConfigObject with values that match
          value. If you change the template, send the complete metaConfigObject of the new template.

          template_html in the response is preview markup only; you do not need it to build the request.

          Returns 404 TEMPLATE_NOT_FOUND if the template_id does not exist.
        param_overrides:
          template_id:
            description: |
              The template ID (for example, promo_banner_demo).
              Obtain this from list_offer_templates — it is the 'id' field in the data array.
      tags:
        - Public Offerings
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferTemplateGetResponse'
              example:
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                type: template
                data:
                  id: promo_banner_demo
                  value: promo_banner_demo
                  label: Promo Banner
                  template_config:
                    id:
                      label: ID
                      outputKeyName: id
                      value: ''
                      isValid: true
                      errorMessage: []
                      dataType: string
                      validations:
                        REQUIRED: true
                    title:
                      label: Title
                      outputKeyName: title
                      value: Your offer title
                      isValid: true
                      errorMessage: []
                      dataType: string
                      validations:
                        REQUIRED: true
                    description:
                      label: Description
                      outputKeyName: description
                      value: ''
                      isValid: true
                      errorMessage: []
                      dataType: string
                      validations: {}
                    cta_label:
                      label: CTA Label
                      outputKeyName: cta_label
                      value: Learn more
                      isValid: true
                      errorMessage: []
                      dataType: string
                      validations:
                        REQUIRED: true
                    cta_url:
                      label: CTA URL
                      outputKeyName: cta_url
                      value: ''
                      isValid: true
                      errorMessage: []
                      dataType: string
                      validations:
                        REQUIRED: true
                    cta_target:
                      label: CTA Target
                      outputKeyName: cta_target
                      value: _blank
                      isValid: true
                      errorMessage: []
                      dataType: dropdown
                      validations:
                        REQUIRED: true
                      options:
                      - id: same_tab
                        value: _self
                        label: Same tab
                      - id: new_tab
                        value: _blank
                        label: New tab
                    theme:
                      label: Theme
                      outputKeyName: theme
                      value: light
                      isValid: true
                      errorMessage: []
                      dataType: dropdown
                      validations: {}
                      options:
                      - id: light_theme
                        value: light
                        label: Light
                      - id: dark_theme
                        value: dark
                        label: Dark
                  template_html: <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Promo Banner</title><style>.promo-banner{padding:24px;text-align:center;font-family:sans-serif}.promo-banner.dark{background:#1a1a1a;color:#fff}.promo-banner .cta{display:inline-block;margin-top:16px}</style></head><body><div class="promo-banner ${config.theme.value}"><h3>${config.title.value}</h3><p>${config.description.value}</p><a class="cta" href="${config.cta_url.value}" target="${config.cta_target.value}">${config.cta_label.value}</a></div></body></html>
                  template_meta: {}
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error code: `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Template not found (`TEMPLATE_NOT_FOUND`). The `template_id` does not exist or does
            not belong to the authenticated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TEMPLATE_NOT_FOUND
                  message: Template not found.
                  target: offering
                  details:
                    - code: TEMPLATE_NOT_FOUND
                      target: template_id
                      message: Template not found.
                  doc_url: "https://www.moengage.com/docs/api/offerings/offerings-overview"
                response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. An unexpected condition prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
      description: >
        The ID of the personalization template to retrieve (for example, `promo_banner_demo`).
        This is the template's natural key, not a prefixed ObjectId. You can fetch template
        IDs using the [List Offer Templates API](/api/public-offerings/list-offer-templates).
  schemas:
    OfferTemplateGetResponse:
      description: Full detail for a single personalization template.
      type: object
      properties:
        response_id:
          type: string
          description: Trace identifier for the response.
          example: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type:
          type: string
          enum: [template]
          description: Object type of the response. Always `template` for this endpoint.
        data:
          $ref: '#/components/schemas/OfferTemplateDetail'

    OfferTemplateDetail:
      description: >
        A personalization template's identity, its field-level configuration, and its
        preview HTML.
      type: object
      properties:
        id:
          type: string
          description: >
            The template's ID (natural key). Use this value as `meta.templateId` in
            template-type offering content when calling Create Offering.
          example: promo_banner_demo
        value:
          type: string
          description: Returned alongside `id`; identical to `id` in observed responses.
          example: promo_banner_demo
        label:
          type: string
          description: Human-readable display name of the template.
          example: Promo Banner
        template_config:
          type: object
          description: >
            The template's fields, keyed by field name. Each entry describes one field —
            its label, type, current value, whether it's required, and (for dropdowns) the
            valid options. A template with no configured fields returns an empty object `{}`.
          additionalProperties:
            $ref: '#/components/schemas/TemplateConfigField'
        template_html:
          type: string
          description: >
            The template's HTML, used to render the preview on the dashboard. Field values
            are interpolated with `${config.<fieldName>.value}`. Empty string if the template
            has no HTML.
        template_meta:
          type: object

    TemplateConfigField:
      description: >
        A single field within a template's `template_config`. Describes the field's type,
        current value, requirement, and — for dropdowns — its valid options.
      type: object
      properties:
        label:
          type: string
          description: Human-readable label for the field.
          example: Aspect Ratio
        outputKeyName:
          type: string
          description: The field's key name.
          example: aspectRatio
        value:
          type: string
          description: The field's current value. Empty string if no value is set.
          example: 4x3
        dataType:
          type: string
          description: >
            The field's type. Values seen in responses: `string`, `md`, and `dropdown`.
            A `dropdown` field lists its allowed choices in `options`. Other values may appear.
          example: dropdown
        validations:
          type: object
          description: >
            Validation rules for the field. `REQUIRED: true` means you must provide this
            field when creating an offering.
          additionalProperties:
            type: boolean
          example:
            REQUIRED: true
        options:
          type: array
          description: >
            The selectable options for a `dropdown` field. When submitting a value in Create
            Offering, use the option's `value` — not its `label` or `id`.
          items:
            type: object
            properties:
              id:
                type: string
                description: Option identifier. Identical to `value` for these templates.
              value:
                type: string
                description: The value to submit when this option is selected.
              label:
                type: string
                description: Display text for the option. Not for submission — may contain spaces.
          example:
            - id: 4x3
              value: 4x3
              label: 4x3
            - id: 16x9
              value: 16x9
              label: 16x9

    OfferTemplateListItem:
      description: >
        Summary representation of a personalization template returned in
        GET /v5/offers/templates list responses.
      type: object
      properties:
        id:
          type: string
          description: >
            Caller-assigned natural key for the template (not a prefixed ObjectId — §9.3
            deviation, intentional). Copy this value verbatim into
            offer_content.locales["0"].variations.*.content_1.meta.templateId when
            creating template-type content.
          example: promo_banner_demo
        value:
          type: string
          description: Identical to id. Present for form-select UI compatibility.
          example: promo_banner_demo
        label:
          type: string
          description: Human-readable display name of the template.
          example: Promo Banner
        template_type:
          type: array
          description: Tags describing where this template can be used. Empty if unset.
          items:
            type: string
          example: []
      example:
        id: promo_banner_demo
        value: promo_banner_demo
        label: Promo Banner
        template_type: []

    CursorPagination:
      description: Pagination metadata included in list responses.
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque cursor pointing to the start of the next page. Pass this value as the
            cursor query parameter on the next request. null when there are no more pages.
          example: "b2ZmZXJzOjY1YTFjMGRlOWIyZjRhN2Q4ZTNjNWYxMQ=="
        limit:
          type: integer
          description: Number of items returned per page, matching the limit query parameter.
          example: 20
        has_more:
          type: boolean
          description: >
            Whether additional pages exist. When true, pass next_cursor on the next request.
            When false, the current page is the last page.
          example: false
        total_count:
          type: integer
          format: int64
          description: >
            Total number of items matching the applied filters — offerings and drafts for
            the offers list, templates for the templates list.
          example: 42

    ErrorResponse:
      type: object
      required: [response_id]
      properties:
        error:
          type: object
          required: [code, message, doc_url]
          properties:
            code:
              type: string
              description: Machine-readable ALL_CAPS_SNAKE_CASE error code.
              example: VALIDATION_FAILED
            message:
              type: string
              description: Human-readable explanation. Specific enough for AI agents to act on.
            target:
              type: string
              description: The field or resource that caused the error (e.g. "scheduling.expiry_datetime").
            details:
              type: array
              description: >
                Per-field error entries for VALIDATION_FAILED responses. All field violations
                are collected and returned in a single response — never truncated.
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: Field-level error code.
                  target:
                    type: string
                    description: Dot-notation path to the failing field.
                  message:
                    type: string
                    description: Human-readable description of the field-level violation.
            doc_url:
              type: string
              description: Link to documentation for this error code.
              example: "https://www.moengage.com/docs/api/offerings/offerings-overview"
        response_id:
          type: string
          description: >
            Trace identifier — same format as success responses ("resp_" + X-MOE-Request-Id).
            Always present even on error responses for log correlation.

    OfferingListItem:
      description: >
        Summary representation of an offering returned in GET /v5/offers list responses.
        Only these six fields are returned. Use the `fields` query parameter to request a
        sparse subset of them (e.g. `fields=id,display_name,status`).
      type: object
      properties:
        id:
          type: string
          description: >
            Stable prefixed offering identifier assigned by the server at creation.
            Format: the literal prefix "offer_" followed by the hex MongoDB ObjectId.
            Use this value as the {offer_id} path parameter in PATCH /v5/offers/{offer_id}.
          example: "offer_65a1c0de9b2f4a7d8e3c5f10"
        display_name:
          type: string
          description: Unique display name of the offering within the workspace.
          example: Summer_Sale_Promo_2026
        status:
          type: string
          description: >
            Current lifecycle status of the offering (always lowercase).
            "active" — offering is live and eligible to be returned by Decision Policies.
            "scheduled" — start_datetime is in the future; not yet live.
            "expired" — expiry_datetime has passed; no longer served.
            "archived" — manually archived; excluded from decisioning.
            "draft" — incomplete; not yet published.
          enum: [active, scheduled, expired, archived, draft]
          example: active
        tags:
          type: array
          description: >
            Names of the tags attached to this offering. Tags are used for offer grouping and Decision Policy selection.
          items:
            type: string
          example: ["SUMMER_SALE", "NEW_USER_ACQUISITION"]
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the offering was first created.
          example: "2026-01-15T09:00:00Z"
        created_by:
          type: string
          description: Email address of the user who created this offering.
          example: marketing-team@example.com
      example:
        id: "offer_65a1c0de9b2f4a7d8e3c5f10"
        display_name: Summer_Sale_Promo_2026
        status: active
        tags: ["SUMMER_SALE", "NEW_USER_ACQUISITION"]
        created_at: "2026-01-15T09:00:00Z"
        created_by: marketing-team@example.com

    ClientOfferCreateRequest:
      description: |
        Request body for creating an Offering via `POST /v5/offers`.

        Required field: `created_by`. A request ID is also required, either as `request_id` in the
        body or as the `X-MOE-Request-Id` header. All other fields are optional while the offering is a
        draft, so you can create a draft with a few fields and complete it later with Update Offering.

        Some fields are required to publish the offering: `display_name`, `priority`, `scheduling`,
        `segment_info`, `offer_content` and `variation_meta`, plus `attribution_multiplier` and
        `imp_track_hours` when you add a conversion goal (`conversion`). To see what is still missing, call
        [Validate Offering](/api/public-offerings/validate-offering).
      type: object
      required: [created_by]
      properties:
        display_name:
          type: string
          description: |
            Unique display name for this offering within the workspace. Names are
            case-sensitive and must be unique. Follow these rules:

            - **Length:** 5–100 characters, measured after leading and trailing spaces are trimmed.
            - **Starting character:** Must start with a letter (A–Z or a–z). It cannot start with a digit, a space, or a special character.
            - **Letters:** Must contain at least one letter (A–Z or a–z).
            - **Allowed characters:** Letters, digits, spaces, and the special characters hyphen (`-`), ampersand (`&`), underscore (`_`), percent (`%`), and round brackets (`(` and `)`).
          minLength: 5
          maxLength: 100
          example: Summer_Sale_Promo_2026
        description:
          type: string
          description: >
            Optional free-text description of the offering's purpose, targeting rationale,
            or expected user experience. Visible in the MoEngage UI offering list.
          maxLength: 500
          example: 20% discount for returning users who have not purchased in 30 days
        priority:
          type: integer
          description: >
            Static priority score for offer ranking. Lower number means lower priority
            (1 is lowest priority, 100 is highest). This score is used when the Decision
            Policy ranking strategy is set to Offering Priority.
          minimum: 1
          maximum: 100
        created_by:
          type: string
          format: email
          description: >
            Email address of the user creating this offering.
          example: marketing-team@example.com
        request_id:
          type: string
          description: |
            Optional. A unique ID for this request, used to trace it in logs and support tickets. A UUID v4 is recommended. If you omit it, the `X-MOE-Request-Id` header is used. If you send both, `request_id` is used. If neither is sent, the API returns `400 REQUIRED_FIELD_MISSING`.
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        status:
          type: string
          description: |
            Optional. Offerings created through the API are always saved as drafts, so the only accepted value is `draft`. If you omit `status`, the offering is created in `draft` state. Any other value returns `400 INVALID_STATUS`. Publishing isn't available through the API. To make the offering live, publish the draft manually from the MoEngage dashboard.

            Creating a draft requires the **Create & Manage** permission. Without it, the API returns `403 INSUFFICIENT_SCOPE`.
          enum: [draft]
          example: draft
        tags:
          type: array
          description: >
            Names of existing tags to attach to the offering (for example `SUMMER_SALE`). Tags are used to group offerings and to select offerings in Decision Policies.
          items:
            type: string
          maxItems: 10
          example: ["SUMMER_SALE", "NEW_USER_ACQUISITION"]
        scheduling:
          $ref: '#/components/schemas/OfferSchedulingCreate'
        segment_info:
          $ref: '#/components/schemas/OfferSegmentInfo'
        insession_attr_info:
          $ref: '#/components/schemas/InSessionAttrInfo'
        offer_content:
          $ref: '#/components/schemas/OfferContent'
        variation_meta:
          $ref: '#/components/schemas/OfferVariationMeta'
        capping_rules:
          $ref: '#/components/schemas/OfferCappingRules'
        is_global_control_enabled:
          type: boolean
          description: >
            Whether the global control group is enabled.
          default: false
        imp_track_hours:
          type: integer
          description: |
            The attribution window for conversion goal tracking. Required to publish when `conversion` is provided.

            The unit and allowed range depend on `attribution_multiplier`. Despite its name, the value is in days when `attribution_multiplier` is `24`:

            - `attribution_multiplier` is `1` — hours. `imp_track_hours` must be between 1 and 36.
            - `attribution_multiplier` is `24` — days. `imp_track_hours` must be between 1 and 10.
          minimum: 1
          maximum: 36
          example: 36
        attribution_multiplier:
          type: integer
          description: |
            Sets the unit for conversion goal tracking. Required to publish when `conversion` is provided. Accepts only `1` or `24`:

            - `1` — tracking is done in hours. `imp_track_hours` must be between 1 and 36.
            - `24` — tracking is done in days. `imp_track_hours` must be between 1 and 10.
          enum: [1, 24]
          example: 1
        offering_attribute_configuration:
          type: array
          description: >
            Custom attributes assigned to this offering. These attributes are used in
            Decision Policy using the Custom formula ranking strategy.
          items:
            $ref: '#/components/schemas/OfferAttributeConfigurationRequest'
          maxItems: 5
        conversion:
          $ref: '#/components/schemas/ConversionDto'
          description: >
            Conversion goal configuration for measuring offering effectiveness.
            This can be set at creation time or later via PATCH while the offering is a draft.

            When you add a conversion goal, `attribution_multiplier` and `imp_track_hours` are also required to publish.

    ClientOfferPatchRequest:
      description: |
        Request body for partially updating an existing offering via the public API (`PATCH /v5/offers/{offer_id}`). Only the fields explicitly provided in the request body will be modified.

        Only offerings in `draft` state can be updated, and all fields can be edited on a draft. Updating an offering that isn't a draft returns `400 INVALID_STATUS_TRANSITION` (or `403 EXPIRED_OFFERING` for an expired offering). The API can't change an offering's `status`; sending `status` returns `400 INVALID_STATUS`. To make a draft live, publish it manually from the MoEngage dashboard.

        `last_updated_at` is required on every request. Get it from the `updated_at` field in the [Get Offering](/api/public-offerings/get-offering) response. A request ID is also required, either as `request_id` in the body or as the `X-MOE-Request-Id` header.

        `attribution_multiplier` and `imp_track_hours` are required to publish when `conversion` is provided.
      type: object
      required: [updated_by, last_updated_at]
      properties:
        updated_by:
          type: string
          format: email
          description: >
            Email address of the team member making this update.
          example: marketing-team@example.com
        request_id:
          type: string
          description: |
            Optional. A unique ID for this request, used to trace it in logs and support tickets. A UUID v4 is recommended. If you omit it, the `X-MOE-Request-Id` header is used. If you send both, `request_id` is used. If neither is sent, the API returns `400 REQUIRED_FIELD_MISSING`.
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        last_updated_at:
          type: string
          format: date-time
          description: |
            The offering's last-updated timestamp. It guards against concurrent updates. Required on every request.

            To get it, call [Get Offering](/api/public-offerings/get-offering) and pass the `updated_at` value from the response as `last_updated_at`.

            If the value doesn't match the offering's current version, the API returns `409 VERSION_CONFLICT`. This check runs before the offering's state is checked.
          example: "2026-11-16T10:27:45.194Z"
        display_name:
          type: string
          description: |
            Updated display name for the offering. Must remain unique within the workspace. Follow these rules:

            - **Length:** 5–100 characters, measured after leading and trailing spaces are trimmed.
            - **Starting character:** Must start with a letter (A–Z or a–z). It cannot start with a digit, a space, or a special character.
            - **Letters:** Must contain at least one letter (A–Z or a–z).
            - **Allowed characters:** Letters, digits, spaces, and the special characters hyphen (`-`), ampersand (`&`), underscore (`_`), percent (`%`), and round brackets (`(` and `)`).
          minLength: 5
          maxLength: 100
        description:
          type: string
          description: Updated free-text description of the offering's purpose.
          maxLength: 500
        priority:
          type: integer
          description: Updated static priority score.
          minimum: 1
          maximum: 100
        tags:
          type: array
          description: >
            Tag names. **Full replacement, not additive** — the entire existing tag list is overwritten with this value.
            To add a single tag, send the complete current tag list plus the new tag.
            To remove all tags, send an empty array.
          items:
            type: string
            maxLength: 50
          maxItems: 10
        scheduling:
          $ref: '#/components/schemas/OfferSchedulingPatch'
        segment_info:
          $ref: '#/components/schemas/OfferSegmentInfo'
        insession_attr_info:
          $ref: '#/components/schemas/InSessionAttrInfo'
        offer_content:
          $ref: '#/components/schemas/OfferContent'
        variation_meta:
          $ref: '#/components/schemas/OfferVariationMeta'
        capping_rules:
          $ref: '#/components/schemas/OfferCappingRules'
        is_global_control_enabled:
          type: boolean
          description: >
            Toggle GCG holdout exclusion. When true, GCG members are excluded from
            receiving this offering. When false, all eligible users can receive it.
        imp_track_hours:
          type: integer
          description: |
            Updated attribution window for conversion goal tracking. Required to publish when `conversion` is provided.

            The unit and allowed range depend on `attribution_multiplier`. Despite its name, the value is in days when `attribution_multiplier` is `24`:

            - `attribution_multiplier` is `1` — hours. `imp_track_hours` must be between 1 and 36.
            - `attribution_multiplier` is `24` — days. `imp_track_hours` must be between 1 and 10.
          minimum: 1
          maximum: 36
        attribution_multiplier:
          type: integer
          description: |
            Sets the unit for conversion goal tracking. Required to publish when `conversion` is provided. Accepts only `1` or `24`:

            - `1` — tracking is done in hours. `imp_track_hours` must be between 1 and 36.
            - `24` — tracking is done in days. `imp_track_hours` must be between 1 and 10.
          enum: [1, 24]
          example: 24
        offering_attribute_configuration:
          type: array
          description: >
            Replacement custom attribute configuration. This is a FULL REPLACEMENT —
            the entire existing attribute list is overwritten. At most 5 attributes.
          items:
            $ref: '#/components/schemas/OfferAttributeConfigurationRequest'
          maxItems: 5
        conversion:
          $ref: '#/components/schemas/ConversionDto'

    OfferSegmentInfoResponse:
      description: |
        `included_filters`: criteria a user MUST match to be eligible.
        `excluded_filters`: criteria that DISQUALIFY a user even if they match the
        included filters.
      type: object
      properties:
        filters:
          type: object
          description: >
            Container for inclusion and exclusion filter blocks.
          properties:
            included_filters:
              type: object
              description: >
                The filtering criteria used for including users.
              properties:
                filters:
                  type: array
                  description: >
                    Array of individual filter criteria. Each item is a filter object
                    whose structure varies by filter_type. Common filter_type values:
                    `actions`, `user_attributes`, `custom_segments`.
                  items:
                    type: object
                    description: A single filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  description: >
                    The logical operator to combine filters.
                  enum: [and, or]
            excluded_filters:
              type: object
              description: >
                The filtering criteria used for excluding users.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [and, or]

    ConversionAttributesResponse:
      type: object
      description: >
        Attribute-level filters applied to the conversion event.
      properties:
        filters:
          type: array
          description: >
            Array of attribute filter objects. Each object targets a specific event attribute.
            Follows the same filter structure as `segment_info.filters.included_filters.filters`.
          items:
            type: object
            description: A single attribute filter criterion. Structure varies by filter_type.
          properties:
            included_filters:
              type: object
              description: >
                Inclusion criteria for the conversion attribute filter. Contains a
                "filters" array of filter objects and a "filter_operator" (AND or OR).
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    description: A single filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  enum: [and, or]
            excluded_filters:
              type: object
              description: Exclusion criteria, same structure as included_filters.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [and, or]

    OfferSchedulingResponse:
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering becomes eligible for delivery.
        expiry_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering expires and stops being served.
        timezone:
          type: string
          description: >
            IANA timezone name.
          example: Asia/Kolkata

    ContentBlockResponse:
      type: object
      properties:
        type:
          type: string
          description: >
            Format of the content payload.
            `json` — serialised JSON string. `content_block` — Content Block library reference ID.
            `template` — a serialised JSON string of all the template's field values (the fields you sent, plus the template defaults for the rest).
          enum: [json, content_block, template]
        value:
          oneOf:
            - type: string
            - type: object
              description: For `template` type — a map of template field names to their values.
              additionalProperties: true
        meta:
          type: object
          description: >
            Metadata attached to this content block. For `template` content it includes `templateId` and `metaConfigObject`.
          additionalProperties: true

    OfferContentResponse:
      type: object
      properties:
        content_1:
          $ref: '#/components/schemas/ContentBlockResponse'
          description: >
            Primary content block for single variation offerings.
        locales:
          type: object
          additionalProperties:
            type: object
            description: Content container for a single locale.
            properties:
              variations:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    content_1:
                      $ref: '#/components/schemas/ContentBlockResponse'

    OfferVariationMetaResponse:
      type: object
      properties:
        type:
          type: string
          description: >
            Variation strategy type.
            `SMV` — fixed percentage split.
            `DMV` - adaptive traffic allocation.
          enum: [SMV, DMV]
        smv_distribution:
          type: object
          description: >
            Variation percentage allocation.
          properties:
            split:
              type: object
              description: >
                Map of variations to integer percentage allocation.
              additionalProperties:
                type: integer
        control_group:
          type: object
          description: >
            A percentage of eligible users that are held out as a pure control and do not receive the offering.
          properties:
            is_enabled:
              type: boolean
              description: Whether the offering-level control group holdout is active.
              example: false
            percentage:
              type: integer
              description: >
                Percentage of eligible users to hold out.

    OfferCappingRuleResponse:
      description: A single frequency capping rule (either overall or per-user).
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether this capping rule is enforced.
        limit_value:
          type: integer
          description: >
            Maximum number of deliveries allowed within one limit_schedule period.
            For overall capping, this is the total across all users.
            For user_level capping, this is per individual user.
        limit_schedule:
          type: string
          description: >
            Time window for the capping counter.
          enum: [DAILY, WEEKLY, MONTHLY]

    OfferCappingRulesResponse:
      type: object
      properties:
        overall:
          $ref: '#/components/schemas/OfferCappingRuleResponse'
          description: Total delivery cap across all users within the target segment.
        user_level:
          $ref: '#/components/schemas/OfferCappingRuleResponse'
          description: Per-user delivery cap for individual users.

    ConversionGoalResponse:
      description: A single conversion goal that tracks a specific user action.
      type: object
      properties:
        goal_name:
          type: string
          description: >
            Display name for this conversion goal.
        action:
          type: string
          description: >
            MoEngage event name associated with the conversion goal.
        filter_type:
          type: string
          description: >
            How the conversion event is matched. Only `actions` is supported: it matches by
            event name and optional attribute-level filters.
        attributes:
          $ref: '#/components/schemas/ConversionAttributesResponse'
          description: >
            Optional attribute-level filters to narrow which occurrences of the action
            count as a conversion.
        is_revenue_tracking:
          type: boolean
          description: >
            When true, the conversion also records the monetary value from the event.
        revenue_amount:
          type: string
          description: >
            Name of the event attribute containing the transaction revenue value.
        revenue_currency:
          type: string
          description: >
            ISO 4217 three-letter currency code for revenue tracking.

    ConversionDtoResponse:
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/ConversionGoalResponse'
          description: >
            Primary conversion goal.
        secondary:
          type: array
          description: >
            Additional conversion goals tracked alongside the primary goal.
          items:
            $ref: '#/components/schemas/ConversionGoalResponse'

    OfferAttributeConfigurationResponse:
      description: |
        Assignment of a custom offering attribute and its value(s) to this offering.
      type: object
      properties:
        offering_attribute_id:
          type: string
          description: >
            ID of the Offering Attribute.
        offering_attribute_name:
          type: string
          description: >
            Display name of the referenced Offering Attribute.
        type:
          type: string
          description: >
            Attribute type of the referenced Offering Attribute.
          enum: [FIXED, DYNAMIC]
        selected_values:
          type: array
          description: >
            Selected option value(s) for this attribute.
          items:
            type: object
            properties:
              id:
                type: string
                description: >
                  ID of the option(s) defined as part of the Offering Attribute definition.
                nullable: true
              value:
                type: string
                description: >
                  Option value string.
              score:
                type: integer
                description: >
                  Priority score for this option.
                nullable: true

    OfferSchedulingCreate:
      description: |
        Scheduling window that determines when an offering is eligible for delivery.
        Both `start_datetime` and `expiry_datetime` are required when creating an offering.
      type: object
      required: [start_datetime, expiry_datetime]
      properties:
        start_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering becomes eligible for delivery.
            MUST use the UTC "Z" suffix format.
          example: "2026-06-15T09:00:00Z"
        expiry_datetime:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC datetime when the offering expires and stops being served.
            MUST use the UTC "Z" suffix format.
          example: "2026-09-30T23:59:59Z"
        timezone:
          type: string
          description: >
            IANA timezone name. When omitted, the default timezone set for the workspace will be considered.
          example: Asia/Kolkata, America/New_York, UTC

    OfferSchedulingPatch:
      description: |
        Partial scheduling update for `PATCH` operations. All fields are optional.
        `start_datetime` and `expiry_datetime` can be updated while the offering is a `draft`.
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
          description: >
            Updated `start datetime`. MUST use UTC "Z" suffix.
          example: "2026-06-20T09:00:00Z"
        expiry_datetime:
          type: string
          format: date-time
          description: >
            Updated `expiry datetime`. MUST use UTC "Z" suffix.
          example: "2026-10-31T23:59:59Z"
        timezone:
          type: string
          description: >
            Updated IANA timezone name.
          example: Asia/Kolkata

    OfferSegmentInfo:
      description: |
        Segment targeting configuration that controls which users are eligible to
        receive this offering.

        `included_filters`: criteria a user MUST match to be eligible.
        `excluded_filters`: criteria that DISQUALIFY a user even if they match the
        included filters.

        To target **all users**, use the built-in `moe_all_users` segment:
        ```json
        {
          "filters": {
            "included_filters": {
              "filter_operator": "and",
              "filters": [
                {
                  "filter_type": "custom_segments",
                  "id": "moe_all_users",
                  "name": "All Users"
                }
              ]
            }
          }
        }
        ```
      type: object
      properties:
        filters:
          type: object
          description: >
            Container for inclusion and exclusion filter blocks. Pass an empty object
            to target all users with no segmentation restriction.
          properties:
            included_filters:
              type: object
              description: >
                The filtering criteria used for including users. For detailed payload and supported fields, refer to [Create Filter Segment](https://www.moengage.com/docs/api/filter-segments/create-filter-segment).
              properties:
                filters:
                  type: array
                  description: >
                    Array of individual filter criteria. Each item is a filter object
                    whose structure varies by filter_type. Common filter_type values:
                    `actions`, `user_attributes`, `custom_segments`.
                  items:
                    type: object
                    description: A single UIS filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  description: >
                    The logical operator to combine filters.
                  enum: [and, or]
            excluded_filters:
              type: object
              description: >
                The filtering criteria used for excluding users.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [and, or]

    OfferContent:
      description: |
        The core content payload delivered to the end-user. This object supports two mutually exclusive structures depending on whether your offering uses content variations or experimentation.

        **Mutually Exclusive:** Do not provide both `content_1` and `locales` in the same request payload. Doing so will result in a validation error.

        ### 1. Flat Format (No Content Variations)

        Use this structure for simple offerings that do not require A/B testing or localization.

        * **Payload Structure:** Send a single `content_1` object at the root level.
        * **Behavior:** The exact same content block is served universally to all eligible users.

        ### 2. Nested Format (Multiple Content Variations)

        Use this structure when `variation_meta.type` is configured as either **SMV** (Static Multi-Variant) or **DMV** (Dynamic Multi-Variant).

        * **Payload Structure:** Send a structured `locales` map object.
        * **Single-Locale Targeting:** For single-locale offerings, you **must** use `"0"` as the literal locale key string.
        * **Variations Mapping:** Inside each locale, the nested `variations` map keys must exactly match the variation IDs defined in `smv_distribution.split` for `SMV`. `DMV` has no split, so the keys are the variations you define. Variation keys must follow the `variation_N` format (e.g. `variation_1`, `variation_2`).
      type: object
      properties:
        content_1:
          $ref: '#/components/schemas/ContentBlock'
          description: >
            Primary content block for single variation offerings.
        locales:
          type: object
          description: >
            Use "0" as the locale key
          additionalProperties:
            type: object
            description: Content container for a single locale.
            required: [variations]
            properties:
              variations:
                type: object
                description: >
                  Each key is a variation of the content payload. The key name **must**
                  match a key in `variation_meta.smv_distribution.split`. 
                additionalProperties:
                  type: object
                  properties:
                    content_1:
                      $ref: '#/components/schemas/ContentBlock'
      example:
        content_1:
          type: json
          value: '{"headline":"Save 20% today","cta_text":"Claim offer","image_url":"https://cdn.example.com/banner.png","cta_url":"https://example.com/offer/summer"}'

    ContentBlock:
      description: |
        This field indicates the type of the offering content payload.

        `json` — Serialised JSON string containing the offering content 
        payload.

        `content_block` — A content block that already exists in the MoEngage Content Block library.
        `value` holds a token with the block's label, and `meta` holds the block's ID and display name.

        `template` — value is a JSON object of the template's field values. `meta.templateId`
        carries the template ID (from `GET /v5/offers/templates`), and `meta.metaConfigObject`
        carries the template's field configuration (from `GET /v5/offers/templates/{template_id}`).
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: >
            Format of the content payload. Determines how `value` is interpreted.
            `json` — serialised JSON string. `content_block` — a Content Block that already exists.
            `template` — object of template field key-value pairs.
          enum: [json, content_block, template]
        value:
          description: |
            Content payload. Interpretation depends on `type`:

            - **`json`** — value must be a **serialised JSON string** (not an inline JSON object).
              The entire payload is encoded as a string. Example: `"{\"discount\": \"10%\"}"`.
              Passing a raw JSON object instead of a string returns `400 INVALID_TYPE`.
            - **`content_block`** — value is a token that contains the block's label, for example
              `{{ContentBlock['Loyalty_Banner']}}`. Use the block's label, not its name. Along with `value`, send
              `meta.personalization_meta.content_block_ids` and `meta.displayed_value`. If you send only the
              block's ID, the API accepts it, but the dashboard doesn't show the block as attached.
            - **`template`** — value is a JSON **object** (not a string) whose keys are the field names
              (`outputKeyName`) from `template_config` in the [Get Offer Template](/api/public-offerings/get-offer-template) response.
              Include every required field (`validations.REQUIRED: true`) and any optional field you want MoEngage to return.
              Each field's value must match the `value` of the same field in `meta.metaConfigObject`; Validate Offering returns
              `TEMPLATE_VALUE_MISMATCH` for any difference. The API doesn't check this when you create or update a draft.
              For a dropdown field, use the option's `value` — not its `label` or `id`.
          oneOf:
            - type: string
              description: >
                For `json` and `content_block` types. For `json`, a serialised JSON string — not an inline object.
                For `content_block`, the token that contains the block's label.
            - type: object
              description: For `template` type — a map of template field names to their values.
              additionalProperties: true

        meta:
          type: object
          description: |
            Metadata for the content item. Used with the `template` and `content_block` types.

            **For `content_block`:** send `personalization_meta.content_block_ids` (an array with the block's ID)
            and `displayed_value` (the block's display name). Use an existing block; create blocks in the dashboard.

            **For `template`:** Get the template's
            field configuration from the [Get Offer Template](/api/public-offerings/get-offer-template)
            API, then apply the following rules:

            - **Matching values:** Set each field's `value` in `metaConfigObject` to the content you want,
              and send the same value in `value`. Validate Offering returns `TEMPLATE_VALUE_MISMATCH` for every
              field whose two values differ, for example: Field 'title' in value ('Summer sale is on') does not
              match its value in meta.metaConfigObject ('Your offer title').
            - **Required fields:** Every field marked `REQUIRED` in `template_config` must be present in `value`
              and have a non-empty `value` in `metaConfigObject` (otherwise Validate Offering returns
              `MISSING_TEMPLATE_FIELD`). The API doesn't check this when you create or update a draft.
            - **Optional fields:** Include them only if you want MoEngage to return them in the
              Personalize API response. MoEngage returns only the fields in `value`.
            - **Dropdown fields:** Pass the option's `value`, not its `label` or `id`.
            - **`metaConfigObject`:** Include it in the `meta` of every variation. MoEngage also uses it to render
              the offering preview in the dashboard. If you change the template, send the complete
              `metaConfigObject` of the new template.
          properties:
            templateId:
              type: string
              description: >
                ID of the template to use. Required when `type` is `template`. Use the `id`
                returned by the List Offer Templates API.
              example: promo_banner_demo
            metaConfigObject:
              type: object
              description: >
                Field configuration of the template, in the same structure as `template_config` in the Get Offer Template response. Each key is a field's `outputKeyName`. Set each field's `value` to match the same field in `value`.
              additionalProperties:
                $ref: '#/components/schemas/TemplateConfigField'
            personalization_meta:
              type: object
              description: >
                For `content_block`. Identifies which content block is used.
              properties:
                content_block_ids:
                  type: array
                  description: IDs of the content blocks that this content item uses. Send the block's 24-character ID.
                  items:
                    type: string
                  example: ["65a1c0de9b2f4a7d8e3c5f30"]
            displayed_value:
              type: string
              description: For `content_block`. The block's display name, as it appears in the dashboard.
              example: Loyalty_Banner
          additionalProperties: true
          example:
            templateId: promo_banner_demo

    OfferVariationMeta:
      description: |
        Configuration for A/B testing content variations.

        * `SMV`: Fixed percentage splits across up to 5 variations.
        * `DMV`: The system automatically learns which variant performs best over time and shifts traffic toward the winner.
        * `Offer Control Group`: A configurable percentage of eligible users to be held out as a pure control group.

        #### Lifecycle & Mutation Rules

        `variation_meta` can be edited via `PATCH /v5/offers/{offer_id}` while the offering is a `draft`. All fields (`type`, `smv_distribution`, `control_group`) are editable on a draft.
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            Variation strategy type.
            `SMV` — fixed percentage split.
            `DMV` - adaptive traffic allocation.
          enum: [SMV, DMV]
        smv_distribution:
          type: object
          description: >
            Variation percentage allocation. Required when `type` is `SMV`. Don't send it when `type` is `DMV`: the allocation is managed automatically, and sending it returns `400 IMMUTABLE_FIELD`.
          properties:
            split:
              type: object
              description: >
                Map of variations to integer percentage allocation.
              additionalProperties:
                type: integer
                minimum: 1
                maximum: 100
              example:
                variation_1: 70
                variation_2: 30
        control_group:
          type: object
          description: >
            When enabled, a percentage of eligible users are held out as a pure control and do not receive the offering.
            This operates independently of the workspace-level GCG.
          properties:
            is_enabled:
              type: boolean
              description: Whether the offering-level control group holdout is active.
              example: false
            percentage:
              type: integer
              description: >
                Percentage of eligible users to hold out. Must be between 1 and 99 when
                `is_enabled` is `true`. When `is_enabled` is `false`, send `0` or omit the field.
              minimum: 0
              maximum: 99
              example: 10
      example:
        type: SMV
        smv_distribution:
          split:
            variation_1: 70
            variation_2: 30
        control_group:
          is_enabled: true
          percentage: 10

    OfferCappingRules:
      description: |
        Frequency capping configuration that limits how often this offering is delivered.
        Two independent capping rules can be configured and enabled simultaneously.

        `overall`: Limits the TOTAL number of times the offering is delivered across
        **ALL users in the target segment** within the capping schedule period.

        `user_level`: Limits the number of times any SINGLE user can receive the
        offering within the capping schedule period.
      type: object
      properties:
        overall:
          $ref: '#/components/schemas/OfferCappingRule'
          description: Total delivery cap across all users within the target segment.
        user_level:
          $ref: '#/components/schemas/OfferCappingRule'
          description: Per-user delivery cap for individual users.
      example:
        overall:
          enabled: true
          limit_value: 10000
          limit_schedule: DAILY
        user_level:
          enabled: true
          limit_value: 3
          limit_schedule: WEEKLY

    OfferCappingRule:
      description: A single frequency capping rule (either overall or per-user).
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether this capping rule is enforced. When false, all other fields are ignored.
          example: true
        limit_value:
          type: integer
          description: >
            Maximum number of deliveries allowed within one limit_schedule period.
            Required when enabled is true. Must be at least 1.
            For overall capping, this is the total across all users.
            For user_level capping, this is per individual user.
          minimum: 1
          example: 3
        limit_schedule:
          type: string
          description: >
            Time window for the capping counter.
          enum: [DAILY, WEEKLY, MONTHLY]
          example: WEEKLY

    ConversionDto:
      description: |
        Conversion goals to track. Each goal needs `goal_name`, `action` and `attributes`. When there are no secondary
        goals, send `secondary` as `[]`. The dashboard needs `attributes` and `secondary` to display the goals.

        You can set a conversion goal when you create the offering, or later with PATCH while the offering is a `draft`.
        Updating `conversion` replaces the existing goals, so send the complete `primary` goal along with every
        secondary goal you want to keep.

        When you add a conversion goal, `attribution_multiplier` and `imp_track_hours` are also required to publish.
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/ConversionGoal'
          description: >
            The primary conversion goal. Revenue tracking is available only on this goal.
        secondary:
          type: array
          maxItems: 4
          description: >
            Additional conversion goals tracked along with the primary goal. When there are none, send `[]`.
            You can add up to 4 secondary goals (5 goals in total). Secondary goals can't track revenue.
          items:
            $ref: '#/components/schemas/ConversionGoal'

    ConversionGoal:
      description: A single conversion goal that tracks a specific user action.
      type: object
      required: [goal_name, action, attributes]
      properties:
        goal_name:
          type: string
          description: >
            Display name for this conversion goal.
          example: Add to Cart
        action:
          type: string
          description: >
            The name of an existing MoEngage event in your workspace that counts as a conversion. Enter it
            exactly as it appears in MoEngage. `goal_name` is only a label.
          example: add_to_cart
        filter_type:
          type: string
          description: >
            How the conversion event is matched. Only `actions` is supported: it matches by
            event name and optional attribute-level filters. Any other value, including `ACTIONS`,
            is rejected when the offering is validated.
          enum: [actions]
          example: actions
        attributes:
          $ref: '#/components/schemas/ConversionAttributesDto'
          description: >
            Attribute-level filters that narrow down which occurrences of the action count as a conversion
            (for example, only purchase events where category = "Electronics"). If you don't want to filter, send
            `{"filter_operator": "and", "filters": []}`. The dashboard needs this block to display the goal.
        is_revenue_tracking:
          type: boolean
          description: >
            When true, the conversion also records the monetary value from the event, and the
            `revenue_amount` and `revenue_currency` fields must be set. Revenue tracking is available only
            on the primary goal. If you aren't tracking revenue, leave out `is_revenue_tracking`,
            `revenue_amount` and `revenue_currency` instead of sending `false`.
          default: false
        revenue_amount:
          type: string
          description: >
            Name of the event attribute containing the transaction revenue value.
            Should be used only when `is_revenue_tracking` is true. The attribute must be a
            numeric field on the tracked event.
          example: order_value
        revenue_currency:
          type: string
          description: >
            ISO 4217 three-letter currency code for revenue tracking
            (e.g. "USD", "EUR", "GBP", "INR"). Should be used only when `is_revenue_tracking` is true.
          example: USD

    ConversionAttributesDto:
      type: object
      description: >
        Attribute-level filters applied to the conversion event. Allows narrowing the
        conversion signal to a specific subset of occurrences of the tracked action
        (e.g. only purchases where category equals "Electronics").
      properties:
        filters:
          type: array
          description: >
            Array of attribute filter objects. Each object targets a specific event attribute.
            Follows the same filter structure as `segment_info.filters.included_filters.filters`.
          items:
            type: object
            description: A single attribute filter criterion. Structure varies by filter_type.
          properties:
            included_filters:
              type: object
              description: >
                Inclusion criteria for the conversion attribute filter. Contains a
                "filters" array of UIS filter objects and a "filter_operator" (AND or OR).
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    description: A single UIS filter criterion. Structure varies by filter_type.
                filter_operator:
                  type: string
                  enum: [and, or]
                  example: and
            excluded_filters:
              type: object
              description: Exclusion criteria, same structure as included_filters.
              properties:
                filters:
                  type: array
                  items:
                    type: object
                filter_operator:
                  type: string
                  enum: [and, or]

    OfferAttributeConfigurationRequest:
      description: |
        Assignment of a custom offering attribute and its value(s) to this offering.
      type: object
      required: [offering_attribute_id, selected_values]
      properties:
        offering_attribute_id:
          type: string
          description: >
            ID of the Offering Attribute. 
        offering_attribute_name:
          type: string
          description: >
            Display name of the referenced Offering Attribute.
          example: Product Category
        type:
          type: string
          description: >
            Attribute type of the referenced Offering Attribute.
          enum: [FIXED, DYNAMIC]
          example: FIXED
        selected_values:
          type: array
          description: >
            Selected option value(s) for this attribute. At least one value is
            required. For `DYNAMIC` attributes, at most one value is allowed per assignment.
            For `FIXED` attributes, multiple values are allowed up to the attribute definition's
            `max_inputs_allowed` limit.
          items:
            type: object
            required: [value]
            properties:
              id:
                type: string
                description: >
                  ID of the option(s) defined as part of the Offering Attribute definition.
                nullable: true
              value:
                type: string
                description: >
                  Option value string. It must match an existing option name in the Offering Attribute definition.
                example: Electronics
              score:
                type: integer
                description: >
                  Priority score for this option to be used in a Decision Policy using the Custom Formula ranking strategy.
                  Set to `null` for `DYNAMIC` attributes.
                  Set to a value between 1-100 for `FIXED` attributes.
                minimum: 1
                maximum: 100
                nullable: true
                example: 85
          minItems: 1


    InSessionAttrInfo:
      description: |
        Optional. Targets visitors in real time. In-session attributes enable real-time visitor grouping based on dynamic conditions, using attributes passed as key-value (KV) pairs. Use `included_filters` to include visitors and `excluded_filters` to exclude them.

        You can add up to 10 attributes in a group and up to 5 groups per offering. [Validate Offering](/api/public-offerings/validate-offering) checks these limits.

        Supported data types: `string`, `double`, `bool`, `datetime`, `array_string` and `array_double`. To learn more about in-session attributes and the supported operators and data types, see [In-session attributes](https://www.moengage.com/docs/user-guide/decisioning/offer-decisioning/create-offerings#in-session-attributes).
      type: object
      properties:
        filters:
          type: object
          properties:
            included_filters:
              $ref: '#/components/schemas/InSessionFilterGroup'
            excluded_filters:
              $ref: '#/components/schemas/InSessionFilterGroup'

    InSessionFilterGroup:
      description: A set of in-session filters combined with `filter_operator`. Each entry in `filters` is either a single attribute or a nested group of attributes.
      type: object
      properties:
        filter_operator:
          type: string
          enum: [and, or]
          description: How the entries in `filters` are combined.
          example: and
        filters:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/InSessionNestedFilter'
              - $ref: '#/components/schemas/InSessionAttributeFilter'

    InSessionNestedFilter:
      description: A group of in-session attributes, combined with its own `filter_operator`.
      type: object
      properties:
        filter_type:
          type: string
          enum: [nested_filters]
          description: Always `nested_filters` for a group.
          example: nested_filters
        filter_operator:
          type: string
          enum: [and, or]
          description: How the attributes in this group are combined.
          example: and
        filters:
          type: array
          items:
            $ref: '#/components/schemas/InSessionAttributeFilter'

    InSessionAttributeFilter:
      description: A single in-session attribute condition.
      type: object
      properties:
        filter_type:
          type: string
          enum: [query_parameter]
          description: Always `query_parameter` for an attribute.
          example: query_parameter
        data_type:
          type: string
          enum: [string, double, bool, datetime, array_string, array_double]
          description: Data type of the attribute.
          example: string
        name:
          type: string
          description: Name (key) of the in-session attribute.
          example: OS
        operator:
          type: string
          description: Comparison operator, for example `is`, `greaterThan`, `on` or `in`. The supported operators depend on `data_type`; see the in-session attributes guide.
          example: is
        negate:
          type: boolean
          description: Set to `true` to negate the condition.
          example: false
        case_sensitive:
          type: boolean
          description: Whether the comparison is case sensitive. Applies to `string` and `array_string` attributes only.
          example: false
        value:
          description: Value to compare against. Its type follows `data_type`.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
          example: android
        value_type:
          type: string
          description: For `datetime` attributes, how the value is interpreted, for example `absolute`.
          example: absolute
        array_filter_type:
          type: string
          description: For array attributes, how the values are matched, for example `any_of`.
          example: any_of

    OfferValidationResponse:
      description: Response returned by `POST /v5/offers/{offer_id}/validate`.
      type: object
      properties:
        response_id:
          type: string
          description: >
            Trace identifier for this response. Format: "resp_" + X-MOE-Request-Id.
          example: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type:
          type: string
          enum: [offer_validation]
          description: Resource type discriminator. Always `offer_validation`.
        data:
          type: object
          properties:
            valid:
              type: boolean
              description: >
                `true` when the offering passes every validation. `false` when `errors` lists what to fix.
              example: false
            errors:
              type: array
              description: The validation errors. Not returned when `valid` is `true`.
              items:
                $ref: '#/components/schemas/OfferValidationError'
      example:
        response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type: offer_validation
        data:
          valid: false
          errors:
            - code: REQUIRED_FIELD_MISSING
              target: attribution_multiplier
              message: attribution_multiplier is required when a conversion goal is set.

    OfferValidationError:
      description: A single validation problem found in a draft offering.
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code in `ALL_CAPS_SNAKE_CASE`.
          example: INVALID_ENUM_VALUE
        target:
          type: string
          description: The field that failed validation, in dot-notation.
          example: conversion.primary.filter_type
        message:
          type: string
          description: Human-readable explanation of the problem.
          example: "conversion.primary.filter_type must be 'actions'. Received: 'ACTIONS'."

    PublicOfferCreateResponse:
      description: Response returned by `POST /v5/offers` on successful creation.
      type: object
      properties:
        response_id:
          type: string
          description: >
            Format: `resp_<X-MOE-Request-Id>` header value
            (auto-generated UUID if the `X-MOE-Request-Id` header was not part of the request body).
          example: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type:
          type: string
          enum: [offer]
          description: Resource type discriminator. Always `offer`.
        data:
          type: object
          description: Created offering summary.
          properties:
            id:
              type: string
              description: >
                Offering ID assigned by the server. Format: `offer_<OfferingId>`.
                Use this value as the `{offer_id}` path parameter in subsequent PATCH requests.
              example: "offer_65a1c0de9b2f4a7d8e3c5f10"
            status:
              type: string
              enum: [draft]
              description: >
                Lifecycle status of the newly created offering. Offerings created through the API
                are always `draft`.
              example: draft
            created_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp when the offering was persisted.
              example: "2026-07-09T09:29:18.526Z"
      example:
        response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type: offer
        data:
          id: "offer_65a1c0de9b2f4a7d8e3c5f10"
          status: draft
          created_at: "2026-07-09T09:29:18.526Z"

    PublicOfferPatchResponse:
      description: Response returned by `PATCH /v5/offers/{offer_id}` on successful update.
      type: object
      properties:
        response_id:
          type: string
          description: >
            Format: `resp_<X-MOE-Request-Id>` header value
            (auto-generated UUID if the `X-MOE-Request-Id` header was not part of the request body).
          example: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type:
          type: string
          enum: [offer]
        data:
          type: object
          description: Updated offering summary.
          properties:
            id:
              type: string
              description: Offering ID
              example: "offer_65a1c0de9b2f4a7d8e3c5f10"
            status:
              type: string
              enum: [draft]
              description: Current lifecycle status after the update. Always `draft`, because only drafts can be updated.
              example: draft
            updated_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of the update.
              example: "2026-07-09T09:29:18.526Z"
      example:
        response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        type: offer
        data:
          id: "offer_65a1c0de9b2f4a7d8e3c5f10"
          status: draft
          updated_at: "2026-07-09T09:29:18.526Z"

    PublicOfferGetResponse:
      type: object
      properties:
        response_id:
          type: string
        type:
          type: string
          example: offer
        data:
          type: object
          properties:
            id:
              type: string
              description: Offering ID assigned by the server.
            status:
              type: string
              description: Lifecycle status of the offering.
              example: scheduled
            created_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp.
              example: "2026-08-07T23:42:21.556936210Z"
            updated_at:
              type: string
              format: date-time
              description: >
                ISO 8601 UTC timestamp of the last update. Pass this value as `last_updated_at`
                when you update the offering.
              example: "2026-08-07T23:42:21.556979662Z"
            updated_by:
              type: string
              format: email
              description: Email address of the team member making this update.
              example: marketing.team@example.com
            created_by:
              type: string
              format: email
              description: Email address of the user creating this offering.
              example: marketing.team@example.com
            display_name:
              type: string
              description: >
                Unique display name for this offering within the workspace.
              example: personalized_offer
            description:
              type: string
              description: >
                Optional free-text description of the offering's purpose.
              example: Configured using personalization template
            priority:
              type: integer
              description: >
                Static priority score for offer ranking. Lower number means lower priority
                (1 is lowest priority, 100 is highest).
              example: 90
            tags:
              type: array
              items:
                type: string
              description: >
                Names of the tags attached to this offering.
            scheduling:
              allOf:
                - $ref: '#/components/schemas/OfferSchedulingResponse'
              description: Scheduling window that determines when an offering is eligible for delivery.
            segment_info:
              allOf:
                - $ref: '#/components/schemas/OfferSegmentInfoResponse'
              description: Segment targeting configuration that controls which users are eligible to receive this offering.
            insession_attr_info:
              allOf:
                - $ref: '#/components/schemas/InSessionAttrInfo'
              description: In-session attribute targeting configured for this offering, if any.
            offer_content:
              allOf:
                - $ref: '#/components/schemas/OfferContentResponse'
              description: The core content payload delivered to the end-user.
            variation_meta:
              allOf:
                - $ref: '#/components/schemas/OfferVariationMetaResponse'
              description: Configuration for A/B testing content variations.
            capping_rules:
              allOf:
                - $ref: '#/components/schemas/OfferCappingRulesResponse'
              description: Frequency capping configuration that limits how often this offering is delivered.
            is_global_control_enabled:
              type: boolean
              description: >
                Whether the global control group is enabled.
              example: true
            imp_track_hours:
              type: integer
              description: >
                The attribution window for conversion goal tracking. The unit depends on
                `attribution_multiplier`: hours when it is `1`, days when it is `24`.
            attribution_multiplier:
              type: integer
              enum: [1, 24]
              description: >
                Sets the unit for conversion goal tracking: `1` for hours, `24` for days.
                It also determines the allowed range of `imp_track_hours` (1 to 36 hours, or 1 to 10 days).
              example: 1
            offering_attribute_configuration:
              type: array
              description: >
                Custom attributes assigned to this offering.
              items:
                $ref: '#/components/schemas/OfferAttributeConfigurationResponse'
            conversion:
              allOf:
                - $ref: '#/components/schemas/ConversionDtoResponse'
              description: List of conversion goals to track.
      example:
        response_id: resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3
        type: offer
        data:
          id: offer_65a1c0de9b2f4a7d8e3c5f10
          status: draft
          created_at: '2026-11-16T10:27:45.194Z'
          updated_at: '2026-11-16T10:27:45.194Z'
          updated_by: john.doe@example.com
          created_by: john.doe@example.com
          display_name: Summer_Sale_Conversion
          description: Summer sale offer with a purchase conversion goal
          priority: 50
          tags:
          - SUMMER_SALE
          - NEW_USER_ACQUISITION
          scheduling:
            start_datetime: '2027-06-01T00:00:00Z'
            expiry_datetime: '2027-08-31T23:59:00Z'
            timezone: Asia/Kolkata
          segment_info:
            filters:
              included_filters:
                filter_operator: and
