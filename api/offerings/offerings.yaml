    patch:
      security:
        - Basic Auth (Create & Manage): []
        - OAuth 2.0 (Create & Manage): []
      operationId: updatePublicOffering
      summary: Update Offering
      description: |
        Modify an existing offering. Only the fields you include in the request body are
        changed.

        When you change template content, send `meta.metaConfigObject` with each field's `value` matching the same field in `value`.

      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Partially update an existing offering. Only the fields included in the request body
          are changed — all other fields retain their current values.

          Use list_offerings first to discover the offering ID if you don't already have it.

          last_updated_at is required on every call: call get_offering first and pass the
          offering's updated_at value as last_updated_at.

          Common update patterns:
            - Extend expiry: include only scheduling.expiry_datetime with a later date (Z suffix required)
            - Rename: include only display_name (same naming rules as create)
            - Update content: include only offer_content
            - Replace tags: include tags as a full list of tag names (full replacement, not additive).

          Only offerings in draft state can be updated, and all fields can be edited on a draft.
          Offerings in any other state cannot be updated: returns 400 INVALID_STATUS_TRANSITION, or 403 EXPIRED_OFFERING if the offering is expired.
          Returns 404 if the {offer_id} does not exist — verify with list_offerings first.

          In-session targeting (optional): include insession_attr_info to target visitors by in-session attributes
          (key-value pairs passed at decision time). Structure: filters.included_filters and/or filters.excluded_filters,
          each with filter_operator ("and" or "or") and a filters list. Each entry is a single attribute (filter_type
          "query_parameter" with data_type, name, operator, value, negate) or a group (filter_type "nested_filters" with its
          own filter_operator and filters). data_type: string, double, bool, datetime, array_string, array_double;
          case_sensitive applies to string and array_string. Up to 10 attributes per group and 5 groups per offering.

          Always supply a unique Idempotency-Key (UUID v4) header. Same key within 24 hours
          returns the original 200 response without re-applying the update.
        param_overrides:
          offer_id:
            description: |
              Prefixed offering ID to update (it starts with offer_).
              Obtain this from list_offerings — it is the 'id' field in the data array.
      tags:
        - Public Offerings
      parameters:
        - name: offer_id
          in: path
          required: true
          example: "offer_65a1c0de9b2f4a7d8e3c5f10"
          schema:
            type: string
          description: >
            The unique ID of the offering to be updated. Must include the `offer_` prefix
            (the ID starts with `offer_`). You can retrieve the prefixed ID from the
            `data[].id` field in the [List Offerings API](/api/public-offerings/list-offerings) response.
        - name: Idempotency-Key
          in: header
          required: true
          example: "9e3c1a52-6f7b-4d08-b2a4-71c5e8f90d36"
          schema:
            type: string
            format: uuid
          description: >
            UUID v4 idempotency token. Submitting the same key within 24 hours returns the
            original `200 response` without re-creating the Offering. A different body hash on
            the same key returns `409 IDEMPOTENCY_CONFLICT`. A concurrent in-progress request
            with the same key returns `409 DUPLICATE_IDEMPOTENCY_KEY`.
        - name: X-MOE-Request-Id
          in: header
          required: false
          example: "5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
          schema:
            type: string
            format: uuid
          description: >
            Client-supplied trace ID (UUID v4). Echoed back in the `X-MOE-Request-Id` response
            header. Use this to correlate client requests with server-side logs. If you also send `request_id`
            in the body, the body value is used.
