              schema:
                $ref: '#/components/schemas/PublicOfferCreateResponse'
        '400':
          description: |
            Validation errors. All errors are collected before returning, so a single `400` response may contain multiple `details` entries. Validation errors are returned as `VALIDATION_FAILED`, with the specific code in `error.details[].code`.

            The API saves drafts without checking completeness. Required fields, scheduling, split totals, tags, conversion settings, and required template fields are checked by [Validate Offering](/api/public-offerings/validate-offering) and when the offering is published.

            Possible error codes:
            - `REQUIRED_FIELD_MISSING` — `created_by` is absent, or no request ID was sent (neither `request_id` in the body nor the `X-MOE-Request-Id` header). The `target` field identifies the missing field.
            - `INVALID_TYPE` — a field has the wrong type or format (e.g. `content_1.value` is not a JSON object when `type` is `template`; or `scheduling.start_datetime` is not a valid ISO 8601 datetime with UTC "Z" suffix).
            - `OUT_OF_RANGE` — numeric field outside its allowed range (e.g. `priority` outside 1–100, `control_group.percentage` outside 1–99 when the control group is enabled).
            - `INVALID_ENUM_VALUE` — enum field has an unrecognised value.
            - `UNRECOGNISED_FIELD` — the request body contains a field the API doesn't recognise.
            - `INVALID_STATUS` — `status` is not an accepted value. On create, `status` accepts only `draft`.
            - `IMMUTABLE_FIELD` — the request contains a field that can't be set: `name` (it is server-generated; use `display_name`), or `variation_meta.smv_distribution` when `variation_meta.type` is `DMV` (the split is allocated automatically).
            - `INVALID_OFFER_NAME` — `display_name` does not follow the naming rules: 5–100 characters after trimming spaces, starts with a letter, and contains only letters, digits, spaces, and the characters `- & _ % ( )`.
            - `INVALID_TIMEZONE` — `scheduling.timezone` is present but not a valid IANA timezone name (e.g. `Asia/Kolkata`, `America/New_York`, `UTC`).
            - `MISSING_IDEMPOTENCY_KEY` — `Idempotency-Key` header is absent. Add the header with a UUID v4 value.
            - `INVALID_IDEMPOTENCY_KEY` — `Idempotency-Key` is present but not a valid UUID v4. Use a standard UUID v4 format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  summary: "status is not draft"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: INVALID_STATUS
                        target: status
                        message: 'status has an unsupported value: published. Create Offering accepts draft only. Send draft, or omit status to create a draft.'
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                unrecognisedField:
                  summary: "Unknown field in the body"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: UNRECOGNISED_FIELD
                        target: unexpected_field
                        message: 'The request body contains a field the API doesn''t recognise: unexpected_field. Remove the field, or check its name against the API reference, and send the request again.'
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                nameNotAllowed:
                  summary: "name sent instead of display_name"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: IMMUTABLE_FIELD
                        target: name
                        message: '''name'' is server-generated and cannot be set. Only ''display_name'' is accepted.'
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
                dmvWithSplit:
                  summary: "smv_distribution sent for a DMV offering"
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: One or more fields failed validation.
                      target: offering
                      details:
                      - code: IMMUTABLE_FIELD
                        target: variation_meta.smv_distribution
                        message: variation_meta.smv_distribution cannot be provided for DMV type — the split is allocated automatically.
                      doc_url: https://www.moengage.com/docs/api/offerings/offerings-overview#errors
                    response_id: "resp_5b2f7c1e-3d94-4a68-8e1b-9c0a7d42f6a3"
        '401':
          description: |
            Authentication failure. Two sources produce 401 on this endpoint:
            - **Gateway (APISIX)** — credentials missing or invalid. Returns `Content-Type: text/plain`
              with body `{"code":"ER001","target":"Authentication Invalid","message":"..."}`.
            - **Service** — credentials passed the gateway but the injected `X-MOE-Tenant-ID` header
              is missing (request bypassed gateway). Returns `Content-Type: application/json`.
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) authentication failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error codes: `INSUFFICIENT_SCOPE`
              (the API key doesn't have the **Create & Manage** permission) or `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Idempotency conflict. Two distinct error codes are possible:

            **DUPLICATE_IDEMPOTENCY_KEY** — a request with the same Idempotency-Key is already
            in-flight (concurrent duplicate). Wait for the first request to complete before retrying.

            **IDEMPOTENCY_CONFLICT** — the Idempotency-Key was already used within the 24-hour
            window but the request body hash differs from the original request. Use a new
            Idempotency-Key to submit a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v5/offers/{offer_id}:
    get:
      security:
        - Basic Auth (View): []
        - OAuth 2.0 (View): []
      operationId: getPublicOffering
      summary: Get Offering
      description: Retrieve the full configuration of a single offering by its ID.
      x-moe-mcp:
        expose:
          external: true
          internal: true
        tool_description: |
          Retrieve the full configuration of a single offering by its ID.

          Use list_offerings first to find the offering ID if you don't already have it. Use this
          tool when you need more than the summary that list_offerings returns — for example, to read
          an offering's current content, targeting, scheduling, variation, capping, and conversion
          settings before calling update_offering.

          The offer_id must include the "offer_" prefix.

          Its updated_at value is the last_updated_at that update_offering requires.

          Returns 404 if the offer_id does not exist or does not belong to the workspace.
        param_overrides:
          offer_id:
            description: |
              Prefixed offering ID (it starts with offer_).
              Obtain this from list_offerings — it is the 'id' field in the data array.
      tags:
        - Public Offerings
      parameters:
        - name: offer_id
          in: path
          required: true
          example: "offer_65a1c0de9b2f4a7d8e3c5f10"
          schema:
            type: string
          description: >
            Must include the `offer_` prefix
            (the ID starts with `offer_`). You can retrieve the prefixed ID from the
            `data[].id` field in the [List Offerings API](/api/public-offerings/list-offerings) response.
      responses:
        '200':
          description: ""
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed in the current window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window before rate limiting applies.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: UTC epoch second when the current rate-limit window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOfferGetResponse'
        '401':
          $ref: '#/components/responses/GatewayAuthError'
        '403':
          description: |
            Forbidden. Two distinct sources produce 403 on this endpoint:
            - **Gateway (APISIX)** — insufficient scope for this route. Returns `Content-Type: text/plain`
              with body `{"code":"ER007","target":"Authentication Invalid","message":"..."}`.
            - **Service** — returns `Content-Type: application/json`. Error code: `FEATURE_DISABLED`
              (the Offerings feature is not enabled for the workspace).
          content:
            text/plain:
              schema:
                type: string
                description: Gateway (APISIX) scope failure. Body is JSON-formatted but sent as text/plain.
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The `offer_id` does not exist or does not belong to the authenticated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            The rate limit for this endpoint has been exceeded. Retry after the window
            indicated in the `Retry-After` response header (in seconds).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
