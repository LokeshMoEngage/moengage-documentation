  responses:
    GatewayAuthError:
      description: |
        Authentication or authorisation failure from the API gateway layer.
        This response is generated by the gateway before the request reaches the service.
        The body is JSON-formatted but API gateway sends it with `Content-Type: text/plain`.
        Two gateway error codes are possible:
        - `ER001` — credentials missing or invalid (401).
        - `ER007` — credentials valid but insufficient scope for this route (403).
      content:
        text/plain:
          schema:
            type: string
            example: '{"code":"ER001","target":"Authentication Invalid","message":"Auth validation failed."}'
    ServiceUnavailable:
      description: |
        Gateway temporarily unable to route the request. Returned when the
        upstream service is unreachable or the HTTP request cannot be proxied (e.g. malformed
        headers with control characters). Treat as a transient error and retry with exponential back-off.
      content:
        text/html:
          schema:
            type: string
            example: "<html><body><h1>503 Service Temporarily Unavailable</h1></body></html>"

  securitySchemes:
    Basic Auth (View):
      type: http
      scheme: basic
      description: |
        Send your Workspace ID and API key as a base64-encoded `username:password` string.

        - **Username**: Your MoEngage Workspace ID (also known as the App ID), from **Settings** > **Account** > **API keys**.
        - **Password**: An API key generated from **Settings** > **Account** > **API keys**. Click **+ Create new key**, set **Authentication type** to **Basic Auth**, select the **Offerings** group, and assign at least the **View** permission.

        Refer to [API Key Dashboard](/user-guide/settings/account/api-and-api-keys/api-key-dashboard) for details on creating and managing API keys.
    OAuth 2.0 (View):
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send an OAuth 2.0 access token as `Bearer <access_token>`.

        To get a token, click **+ Create new key** on **Settings** > **Account** > **API keys**, set **Authentication type** to **OAuth 2.0**, select the **Offerings** group, and assign at least the **View** permission. Then exchange the key for an access token. Refer to [OAuth 2.0 Overview](/api/oauth/oauth-overview).
    Basic Auth (Create & Manage):
      type: http
      scheme: basic
      description: |
        Send your Workspace ID and API key as a base64-encoded `username:password` string.

        - **Username**: Your MoEngage Workspace ID (also known as the App ID), from **Settings** > **Account** > **API keys**.
        - **Password**: An API key generated from **Settings** > **Account** > **API keys**. Click **+ Create new key**, set **Authentication type** to **Basic Auth**, select the **Offerings** group, and assign at least the **Create & Manage** permission.

        Refer to [API Key Dashboard](/user-guide/settings/account/api-and-api-keys/api-key-dashboard) for details on creating and managing API keys.
    OAuth 2.0 (Create & Manage):
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send an OAuth 2.0 access token as `Bearer <access_token>`.

        To get a token, click **+ Create new key** on **Settings** > **Account** > **API keys**, set **Authentication type** to **OAuth 2.0**, select the **Offerings** group, and assign at least the **Create & Manage** permission. Then exchange the key for an access token. Refer to [OAuth 2.0 Overview](/api/oauth/oauth-overview).
    basicAuth:
      type: http
      scheme: basic
      description: |
        Authentication is done via Basic Auth. This requires a base64-encoded string of your credentials in the format `username:password`.

        - **Username**: Use your MoEngage Workspace ID (also known as the App ID). Find it in the MoEngage dashboard at **Settings** > **Account** > **API keys**.
        - **Password**: Use an API key from **Settings** > **Account** > **API keys**. You need to [generate a new API key](/user-guide/settings/account/api-and-api-keys/api-key-dashboard#create-a-key) to use the Offerings API and select the **Offerings** group under **Create new key** with the permission your calls need: **View** to list and get offerings and templates, **Create & Manage** to create and update offerings and drafts, or **Download** to download offering reports. The key can use Basic Auth or OAuth 2.0.

        Refer to [API Key Dashboard](/user-guide/settings/account/api-and-api-keys/api-key-dashboard) for details on creating and managing API keys.
