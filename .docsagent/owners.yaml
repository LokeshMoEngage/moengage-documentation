# Who owns which MoEngage docs pages. DocsAgent reads this file from the repo to route tickets and PR reviews.
# This folder is listed in .mintignore, so it is never published on the docs site.
#
# How to read it
# - Each person is listed once, with the folders (or pages) they own. Paths are exactly as they appear in this
#   repo, so they match the docs site: user-guide/data/ is https://www.moengage.com/docs/user-guide/data/...
# - A path ending in / covers that folder and everything inside it. A path without / is one page (no .mdx).
# - If two paths match a page, the more specific (longer) one wins. So list the whole area once, and add
#   only the exceptions inside it to someone else.
# - Anything not listed belongs to `default`.
#
# Keeping it current
# - New section or folder: add it under its owner.
# - Owner changes: move the line to the new person.
# - Folder renamed or moved: update the path in the same PR.

